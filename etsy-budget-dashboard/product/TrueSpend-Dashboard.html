<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<title>TrueSpend — Budget Command Center</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --radius:18px; --radius-s:12px;
  --shadow:0 12px 32px rgba(0,0,0,.28);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
[data-theme="midnight"]{--bg:#0d1017;--bg2:#131824;--card:#171e2c;--card2:#1f2739;--ink:#f3eede;--sub:#9aa3b5;--line:#2a3347;--accent:#d8b45a;--accent2:#f0d488;--accent-ink:#241b06;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--track:#2a3347;--nav-bg:#10151f;--hero-glow:rgba(216,180,90,.16)}
[data-theme="vault"]{--bg:#0a1511;--bg2:#0f1f18;--card:#12251d;--card2:#183226;--ink:#eef5ec;--sub:#93ac9c;--line:#274434;--accent:#c9a24b;--accent2:#e8cf7f;--accent-ink:#221a05;--good:#5eead4;--warn:#fbbf24;--bad:#fb7185;--track:#274434;--nav-bg:#0c1a14;--hero-glow:rgba(201,162,75,.15)}
[data-theme="paper"]{--bg:#f4efe6;--bg2:#ece5d6;--card:#fffdf8;--card2:#f6f1e6;--ink:#33302a;--sub:#837768;--line:#ddd2c0;--accent:#b07a2e;--accent2:#d9a75a;--accent-ink:#fffaf0;--good:#1f9d55;--warn:#c77700;--bad:#d64545;--track:#e7ddcb;--nav-bg:#efe8da;--hero-glow:rgba(176,122,46,.14);--shadow:0 12px 28px rgba(90,70,40,.14)}
[data-theme="blush"]{--bg:#160f16;--bg2:#1f1420;--card:#251a28;--card2:#2f2233;--ink:#f8ecf1;--sub:#b79cb0;--line:#43304a;--accent:#e5a4c4;--accent2:#f6c9de;--accent-ink:#33101f;--good:#7ef0c1;--warn:#fbbf24;--bad:#fb7185;--track:#43304a;--nav-bg:#1a121c;--hero-glow:rgba(229,164,196,.14)}
[data-theme="ocean"]{--bg:#08131f;--bg2:#0c1a2b;--card:#102335;--card2:#16304a;--ink:#e9f4ff;--sub:#8fa9c4;--line:#22394f;--accent:#38bdf8;--accent2:#9adcff;--accent-ink:#04222f;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--track:#22394f;--nav-bg:#0a1727;--hero-glow:rgba(56,189,248,.14)}
[data-theme="lavender"]{--bg:#efeef7;--bg2:#e3e1f0;--card:#fbfbff;--card2:#f1eff9;--ink:#2e2b3f;--sub:#7b7694;--line:#d3cfe6;--accent:#6d5bd0;--accent2:#9a8ff0;--accent-ink:#ffffff;--good:#0e9f6e;--warn:#c77700;--bad:#d64545;--track:#e2def2;--nav-bg:#e6e3f3;--hero-glow:rgba(109,91,208,.12);--shadow:0 12px 28px rgba(70,60,120,.14)}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh}
.app{display:flex;min-height:100vh}
.hidden{display:none!important}

/* ---------- Sidebar ---------- */
.sidebar{width:248px;flex-shrink:0;background:var(--nav-bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:4px 10px 18px}
.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0}
.brand-name{font-weight:800;font-size:19px;letter-spacing:.2px}
.brand-sub{font-size:11.5px;color:var(--sub);letter-spacing:.4px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:transparent;color:var(--sub);font-size:14.5px;font-weight:600;border-radius:12px;cursor:pointer;text-align:left;font-family:var(--font)}
.nav button .ico{width:30px;height:30px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.nav button:hover{color:var(--ink);background:var(--card)}
.nav button.active{color:var(--ink);background:var(--card)}
.nav button.active .ico{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink)}
.side-foot{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}

/* ---------- Main / topbar ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--nav-bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand.mini{padding:0;gap:8px}
.brand.mini .brand-mark{width:32px;height:32px;font-size:17px;border-radius:10px}
.brand.mini .brand-name{font-size:16px}
.topbar-right{display:flex;align-items:center;gap:8px}
.pay-pill{font-size:12px;font-weight:700;color:var(--accent2);background:var(--hero-glow);border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}
.content{padding:26px clamp(16px,4vw,40px) 90px;max-width:1180px;width:100%;margin:0 auto}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.view-head h1{font-size:clamp(22px,3.4vw,30px);letter-spacing:-.3px}
.view-head p{color:var(--sub);font-size:13.5px;margin-top:4px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Cards / grids ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:1.1px;color:var(--sub);margin-bottom:14px;font-weight:800}
.card h3 .q{color:var(--accent)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g-hero{grid-template-columns:1.35fr 1fr;margin-bottom:16px}
.mt{margin-top:16px}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;gap:22px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 200px at 18% 0%,var(--hero-glow),transparent 70%);pointer-events:none}
.hero-gauge{flex-shrink:0}
.hero-info{flex:1;min-width:0}
.hero-label{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--sub)}
.hero-amount{font-size:clamp(40px,6vw,58px);font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:4px 0;font-variant-numeric:tabular-nums}
.hero-amount.good{color:var(--good)}.hero-amount.warn{color:var(--warn)}.hero-amount.bad{color:var(--bad)}
.hero-sub{color:var(--sub);font-size:13.5px}
.hero-stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.hstat .v{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.hstat .l{font-size:11.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.8px}

/* ---------- Buttons / inputs ---------- */
.btn{font-family:var(--font);border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .08s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border:0;box-shadow:0 6px 18px var(--hero-glow)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
input,select,textarea{font-family:var(--font);background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px 13px;font-size:14px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--accent)}
label.lbl{display:block;font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.7px;margin:12px 0 6px}
label.lbl:first-child{margin-top:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{padding:0;accent-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--sub);cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Lists / rows ---------- */
.rows{display:flex;flex-direction:column;gap:8px}
.rowitem{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--bg2);border:1px solid transparent}
.rowitem:hover{border-color:var(--line)}
.ric{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;color:#fff;font-weight:800}
.rinfo{flex:1;min-width:0}
.rinfo .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rinfo .s{font-size:12px;color:var(--sub)}
.ramt{font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ramt.neg{color:var(--bad)}.ramt.pos{color:var(--good)}
.iconbtn{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:14px;flex-shrink:0}
.iconbtn:hover{color:var(--ink);border-color:var(--accent)}
.empty{text-align:center;color:var(--sub);padding:26px 10px;font-size:14px}
.empty .big{font-size:34px;display:block;margin-bottom:8px}

/* ---------- Progress / bars ---------- */
.pbar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.pbar.thin{height:7px}
.envrow{padding:10px 0;border-bottom:1px dashed var(--line)}
.envrow:last-child{border-bottom:0}
.envtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.envtop .n{font-weight:700;font-size:14px}
.envtop .a{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.envtop .a b{color:var(--ink)}
.over{color:var(--bad)!important;font-weight:800}

/* ---------- KPI stat cards ---------- */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--sub);font-weight:800}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--sub);margin-top:2px}
.kpi.good .v{color:var(--good)}.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}.kpi.accent .v{color:var(--accent2)}
[data-theme="paper"] .kpi.accent .v,[data-theme="lavender"] .kpi.accent .v{color:var(--accent)}

/* ---------- Calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:800;color:var(--sub);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.5px}
.cal-day{background:var(--bg2);border:1px solid var(--line);border-radius:10px;min-height:64px;padding:6px;font-size:11px;position:relative}
.cal-day .dn{font-weight:800;font-size:12px}
.cal-day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal-day.dim{opacity:.38}
.cal-day.payday{background:linear-gradient(160deg,var(--hero-glow),transparent)}
.cal-ev{margin-top:3px;padding:2px 5px;border-radius:6px;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card2);border:1px solid var(--line)}
.cal-ev.bill{border-left:3px solid var(--warn)}
.cal-ev.paid{opacity:.5;text-decoration:line-through}
.cal-ev.pay{border-left:3px solid var(--good);color:var(--good)}

/* ---------- Bottom nav ---------- */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--nav-bg);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));grid-template-columns:repeat(8,1fr)}
.bottomnav button{background:none;border:0;color:var(--sub);font-size:9.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:var(--font);padding:4px 0}
.bottomnav button .ico{font-size:18px}
.bottomnav button.active{color:var(--accent2)}
[data-theme="paper"] .bottomnav button.active,[data-theme="lavender"] .bottomnav button.active{color:var(--accent)}

/* ---------- Modal / toast / wizard ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:24px 22px 30px}
.modal h2{font-size:20px;margin-bottom:4px}
.modal .msub{color:var(--sub);font-size:13.5px;margin-bottom:16px}
.mrow{display:flex;gap:10px;margin-top:18px}
.mrow .btn{flex:1}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:12px 22px;border-radius:999px;z-index:200;box-shadow:var(--shadow);white-space:nowrap}
.wizard-overlay{position:fixed;inset:0;background:var(--bg);z-index:150;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:20px}
.wizard-card{max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:34px 30px;box-shadow:var(--shadow)}
.wizard-card h1{font-size:26px;margin:10px 0 6px}
.wizard-card .wsub{color:var(--sub);font-size:14px;margin-bottom:8px}
.wsteps{display:flex;gap:6px;margin:18px 0}
.wsteps i{flex:1;height:6px;border-radius:99px;background:var(--track)}
.wsteps i.on{background:var(--accent)}
.wnav{display:flex;gap:10px;margin-top:22px}
.wnav .btn{flex:1}

/* ---------- Simple overlay ---------- */
.simple-overlay{position:fixed;inset:0;background:var(--bg);z-index:120;display:flex;align-items:center;justify-content:center;padding:20px}
.simple-card{text-align:center;max-width:420px;width:100%}
.simple-label{letter-spacing:4px;font-size:13px;font-weight:800;color:var(--sub)}
.simple-amount{font-size:clamp(64px,16vw,110px);font-weight:800;letter-spacing:-3px;margin:8px 0;font-variant-numeric:tabular-nums}
.simple-sub{color:var(--sub);margin-bottom:26px}

/* ---------- Misc ---------- */
.amt{font-variant-numeric:tabular-nums}
body.privacy .amt,body.privacy .hero-amount{filter:blur(7px);user-select:none}
.verdict{border-radius:16px;padding:18px;text-align:center;margin-top:14px;border:1px solid var(--line)}
.verdict.go{background:rgba(74,222,128,.1);border-color:var(--good)}
.verdict.tight{background:rgba(251,191,36,.1);border-color:var(--warn)}
.verdict.skip{background:rgba(248,113,113,.1);border-color:var(--bad)}
.verdict .vv{font-size:24px;font-weight:800}
.verdict.go .vv{color:var(--good)}.verdict.tight .vv{color:var(--warn)}.verdict.skip .vv{color:var(--bad)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme-pick{border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:center;background:var(--bg2)}
.theme-pick.on{border-color:var(--accent)}
.theme-pick .sw{height:44px;border-radius:9px;margin-bottom:8px}
.theme-pick .tn{font-size:12px;font-weight:800}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}
.setrow:last-child{border:0}
.setrow .t{font-weight:700;font-size:14px}
.setrow .s{font-size:12px;color:var(--sub)}
.toggle{width:52px;height:30px;border-radius:99px;background:var(--track);border:1px solid var(--line);cursor:pointer;position:relative;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--sub);transition:all .18s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:24px;background:var(--accent-ink)}
table.plan{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.plan th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--sub);padding:8px;border-bottom:1px solid var(--line)}
table.plan td{padding:9px 8px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--sub);text-transform:uppercase;letter-spacing:.6px}
.badge.auto{color:var(--good);border-color:var(--good)}
.badge.due{color:var(--warn);border-color:var(--warn)}
.badge.overdue{color:var(--bad);border-color:var(--bad)}
.badge.paid{color:var(--sub)}
.searchbar{display:flex;gap:8px;margin-bottom:12px}
.svgwrap{width:100%;overflow:hidden}
.svgwrap svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.alert{border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:10px;border:1px solid var(--line);background:var(--bg2)}
.alert.warn{border-left:4px solid var(--warn)}
.alert.bad{border-left:4px solid var(--bad)}
.alert.good{border-left:4px solid var(--good)}
.alert b{font-weight:800}

/* ---------- Responsive ---------- */
@media(max-width:1080px){.g3{grid-template-columns:repeat(2,1fr)}.g-hero{grid-template-columns:1fr}}
@media(max-width:860px){
  .sidebar{display:none}.topbar{display:flex}.bottomnav{display:grid}
  .g2,.g3{grid-template-columns:1fr}
  .hero{flex-direction:column;text-align:center}
  .hero-stats{justify-content:center}
  .content{padding:18px 14px 110px}
  .cal-day{min-height:52px}
  .themes{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:861px){.modal-overlay{align-items:center;padding:20px}.modal{border-radius:22px}}

</style>
</head>
<body>
<div id="app" class="app">
  <!-- Sidebar (desktop) -->
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">◈</span><div><div class="brand-name">TrueSpend</div><div class="brand-sub">Budget Command Center</div></div></div>
    <nav class="nav" id="mainNav"></nav>
    <div class="side-foot">
      <button class="btn ghost sm" id="btnSimple">◉ Simple view</button>
      <button class="btn ghost sm" id="btnPrivacy">👁 Privacy</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div class="brand mini"><span class="brand-mark">◈</span><span class="brand-name">TrueSpend</span></div>
      <div class="topbar-right">
        <span class="pay-pill" id="payPill"></span>
        <button class="btn ghost sm" id="btnPrivacyM">👁</button>
        <button class="btn primary sm" id="btnQuickAdd">＋ Log</button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>

  <!-- Bottom nav (mobile) -->
  <nav class="bottomnav" id="bottomNav"></nav>
</div>

<!-- Simple mode overlay -->
<div class="simple-overlay hidden" id="simpleOverlay">
  <div class="simple-card">
    <div class="simple-label">SAFE TO SPEND</div>
    <div class="simple-amount amt" id="simpleAmount">$0</div>
    <div class="simple-sub" id="simpleSub"></div>
    <div class="simple-row">
      <button class="btn primary" id="btnSimpleExit">Full dashboard</button>
    </div>
  </div>
</div>

<!-- Wizard overlay -->
<div class="wizard-overlay hidden" id="wizard"></div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modalOverlay"><div class="modal" id="modalBox" role="dialog"></div></div>

<!-- Toast -->
<div class="toast hidden" id="toast"></div>

<input type="file" id="fileInput" accept="application/json" class="hidden">
<script>
/* =====================================================================
   TrueSpend — Budget Command Center (single-file, offline, private)
   Part 1: utils + demo data + store + calculations
===================================================================== */
"use strict";
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));

/* ---------- currency ---------- */
const CURS={USD:{s:"$",p:"before"},EUR:{s:"€",p:"before"},GBP:{s:"£",p:"before"},JPY:{s:"¥",p:"before"},INR:{s:"₹",p:"before"},SEK:{s:"kr",p:"after"},NOK:{s:"kr",p:"after"},DKK:{s:"kr",p:"after"},CAD:{s:"$",p:"before"},AUD:{s:"$",p:"before"},ZAR:{s:"R",p:"before"},BRL:{s:"R$",p:"before"},MXN:{s:"$",p:"before"}};
let CUR="USD";
function money(v,dec){
  const c=CURS[CUR]||CURS.USD; v=Number(v)||0;
  const neg=v<0, a=Math.abs(v);
  const str=dec===0?Math.round(a).toLocaleString("en-US"):a.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  const out=c.p==="before"?c.s+str:str+" "+c.s;
  return (neg?"-":"")+out;
}

/* ---------- dates ---------- */
const DAY=86400000;
function dstr(d){d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){const n=new Date();n.setHours(0,0,0,0);return n;}
function parseD(s){const[a,b,c]=String(s).split("-").map(Number);return new Date(a,b-1,c);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function monthKey(d){d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function fmtD(s){return parseD(s).toLocaleDateString("en-US",{month:"short",day:"numeric"});}
function fmtDlong(s){return parseD(s).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});}
function daysBetween(a,b){return Math.round((parseD(b)-parseD(a))/DAY);}

/* =====================================================================
   Calculations
===================================================================== */
function paydaysBetween(fromD,count){
  // generate next `count` paydays from profile.freq starting at nextPayday
  const out=[];let d=parseD(S.profile.nextPayday||"");
  if(isNaN(d))d=addDays(today(),7);
  const f=S.profile.freq;
  if(f==="semimonthly"){
    // paydays on 1st & 15th — find upcoming
    let cur=new Date(Math.max(d,today()));
    for(let guard=0;guard<400&&out.length<count;guard++){
      const dt=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate());
      if((dt.getDate()===1||dt.getDate()===15)&&dt>=today())out.push(new Date(dt));
      cur=addDays(cur,1);
    }
    return out;
  }
  const step=f==="weekly"?7:f==="monthly"?30:14;
  let cur=new Date(d);
  while(cur<today())cur=addDays(cur,step);
  for(let i=0;i<count;i++){out.push(new Date(cur));cur=addDays(cur,step);}
  return out;
}
function nextPayday(){const p=paydaysBetween(today(),1);return p.length?p[0]:addDays(today(),14);}
function billDueDate(bill,refDate){
  const r=new Date(refDate);let dt=new Date(r.getFullYear(),r.getMonth(),clamp(bill.dueDay,1,28));
  return dt;
}
function isBillPaid(bill,refDate){
  const k=monthKey(refDate);
  if(bill.paid&&bill.paid[k])return true;
  // auto-match: a transaction this month with same name-ish & negative amount?
  return false;
}
function billsDueBetween(a,b,includePast){
  // bills with due dates in [a,b], walking month by month
  const out=[];let cur=new Date(a.getFullYear(),a.getMonth(),1);
  const end=new Date(b.getFullYear(),b.getMonth(),1);
  while(cur<=end){
    for(const bill of S.bills){
      const dt=new Date(cur.getFullYear(),cur.getMonth(),clamp(bill.dueDay,1,28));
      if((includePast||dt>=today())&&dt>=a&&dt<=b&&!isBillPaid(bill,dt))out.push({bill,date:dt});
    }
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  return out.sort((x,y)=>x.date-y.date);
}
function incomeBetween(a,b){
  let total=0;const pays=paydaysBetween(a,12);
  for(const p of pays){if(p>=a&&p<=b)total+=Number(S.profile.payAmount)||0;}
  return total;
}
function txInMonth(refDate){
  const k=monthKey(refDate);
  return S.transactions.filter(t=>monthKey(parseD(t.date))===k);
}
function spentByCat(refDate){
  const m={};for(const t of txInMonth(refDate)){if(t.amount<0)m[t.cat]=(m[t.cat]||0)+Math.abs(t.amount);}
  return m;
}
function monthTotals(refDate){
  let inc=0,exp=0;for(const t of txInMonth(refDate)){if(t.amount>=0)inc+=t.amount;else exp+=Math.abs(t.amount);}
  return{inc,exp,net:inc-exp};
}
function avgDailySpend(){
  const last30=S.transactions.filter(t=>t.amount<0&&daysBetween(t.date,dstr(today()))>=0&&daysBetween(t.date,dstr(today()))<=30);
  let s=0;for(const t of last30)s+=Math.abs(t.amount);
  return last30.length?s/30:45;
}
/* Safe-to-spend: checking + income before next payday − bills due before payday − debt mins − 5% buffer */
function safeToSpend(){
  const t=today(), np=nextPayday();
  const checking=Number(S.profile.checking)||0;
  const inc=incomeBetween(t,addDays(np,-1))+(dstr(np)===dstr(t)?(Number(S.profile.payAmount)||0):0);
  const bills=billsDueBetween(t,np);
  const billTotal=bills.reduce((s,x)=>s+Number(x.bill.amount),0);
  const debtMin=S.debts.reduce((s,d)=>s+Number(d.min),0);
  const buffer=Math.max(0,(checking+inc)*0.03);
  const safe=Math.max(0,checking+inc-billTotal-debtMin-buffer);
  const days=Math.max(1,Math.round((np-t)/DAY));
  return{safe,checking,inc,billTotal,debtMin,buffer,days,perDay:safe/days,bills,np};
}
/* 45-day balance projection */
function projection(days=45){
  const t=today();let bal=Number(S.profile.checking)||0;
  const pays=paydaysBetween(t,8).map(dstr);
  const billMap={};
  for(const b of S.bills){
    for(let m=0;m<3;m++){
      const ref=new Date(t.getFullYear(),t.getMonth()+m,1);
      const dt=new Date(ref.getFullYear(),ref.getMonth(),clamp(b.dueDay,1,28));
      const k=dstr(dt);
      if(!isBillPaid(b,dt))billMap[k]=(billMap[k]||0)+Number(b.amount);
    }
  }
  const daily=avgDailySpend()*0.55; // discretionary burn estimate
  const pts=[{d:dstr(t),bal}];
  for(let i=1;i<=days;i++){
    const dt=addDays(t,i),k=dstr(dt);
    if(pays.includes(k))bal+=Number(S.profile.payAmount)||0;
    if(billMap[k])bal-=billMap[k];
    bal-=daily;
    pts.push({d:k,bal});
  }
  return pts;
}
/* Debt payoff simulator: returns {months,interest,order[]} */
function simulateDebts(debts,extra,method){
  const ds=debts.map(d=>({...d,balance:Number(d.balance),apr:Number(d.apr),min:Number(d.min)}));
  const order=ds.slice().sort((a,b)=>method==="snowball"?a.balance-b.balance:b.apr-a.apr).map(d=>d.id);
  const rank={};order.forEach((id,i)=>rank[id]=i);
  let months=0,interest=0,payment=0;
  const baseMin=ds.reduce((s,d)=>s+d.min,0);
  const monthly=baseMin+Math.max(0,extra);
  for(let guard=0;guard<600;guard++){
    if(ds.every(d=>d.balance<=0))break;
    months++;
    for(const d of ds){if(d.balance>0){const i=d.balance*(d.apr/100/12);d.balance+=i;interest+=i;}}
    let pool=monthly;
    const act=ds.filter(d=>d.balance>0).sort((a,b)=>rank[a.id]-rank[b.id]);
    for(const d of act){const p=Math.min(d.balance,Math.min(d.min,pool));d.balance-=p;pool-=p;payment+=p;}
    for(const d of act){if(pool<=0.005)break;if(d.balance>0){const p=Math.min(d.balance,pool);d.balance-=p;pool-=p;payment+=p;}}
    if(months>=600)break;
  }
  const names=order.map(id=>{const d=debts.find(x=>x.id===id);return d?d.name:"";});
  return{months,interest,totalPaid:payment+interest*0+payment*0+ (function(){return 0;})(),order:names,monthly};
}
function debtSummary(){
  const total=S.debts.reduce((s,d)=>s+Number(d.balance),0);
  const mins=S.debts.reduce((s,d)=>s+Number(d.min),0);
  return{total,mins};
}
/* Insights: last 6 months income vs expense */
function last6(){
  const t=today(),out=[];
  for(let i=5;i>=0;i--){
    const ref=new Date(t.getFullYear(),t.getMonth()-i,1);
    const{inc,exp}=monthTotals(ref);
    out.push({label:ref.toLocaleDateString("en-US",{month:"short"}),inc,exp});
  }
  return out;
}

function gaugeSVG(pct,size=168){

  const col=pct>0.5?"var(--good)":pct>0.25?"var(--warn)":"var(--bad)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 168 168">
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="${trackC()}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*0.75} ${c}" transform="rotate(135 84 84)"/>
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*0.75} ${c}" stroke-dashoffset="${c*0.75*(1-pct)}" transform="rotate(135 84 84)" style="transition:stroke-dashoffset .6s"/>
    <text x="84" y="80" text-anchor="middle" fill="${subC()}" font-size="11" font-weight="700" letter-spacing="2">SAFE</text>
    <text x="84" y="104" text-anchor="middle" fill="currentColor" font-size="26" font-weight="800">${Math.round(pct*100)}%</text>
  </svg>`;
}

function ringSVG(pct,size=120,stroke=12,label=""){

/* ---------- donut ---------- */
function donutSVG(segs,size=190){
  const stroke=30,r=(size-stroke)/2,c=2*Math.PI*r;let acc=0,html="";
  const total=segs.reduce((s,x)=>s+x.v,0)||1;
  for(const g of segs){
    const frac=g.v/total;if(frac<=0)continue;
    html+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${g.color}" stroke-width="${stroke}" stroke-dasharray="${c*frac} ${c}" stroke-dashoffset="${-c*acc}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
    acc+=frac;
  }
  if(!html)html=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${trackC()}" stroke-width="${stroke}"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${html}
    <text x="${size/2}" y="${size/2-6}" text-anchor="middle" fill="${subC()}" font-size="12" font-weight="700">SPENT</text>
    <text x="${size/2}" y="${size/2+18}" text-anchor="middle" fill="currentColor" font-size="20" font-weight="800">${esc(money(total,0))}</text></svg>`;
}
/* ---------- bars ---------- */
function barsSVG(data,w=560,h=220){
  const max=Math.max(1,...data.flatMap(d=>[d.inc,d.exp]));
  const n=data.length,gw=w/n,bw=Math.min(26,(gw-22)/2);
  let html=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">`;
  for(let i=0;i<4;i++){const y=10+(h-44)*i/3;html+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${trackC()}" stroke-width="1"/>`;}
  data.forEach((d,i)=>{
    const cx=gw*i+gw/2,ih=(h-44)*(d.inc/max),eh=(h-44)*(d.exp/max);
    html+=`<rect x="${cx-bw-2}" y="${h-30-ih}" width="${bw}" height="${Math.max(2,ih)}" rx="5" fill="var(--good)" opacity=".85"/>
    <rect x="${cx+2}" y="${h-30-eh}" width="${bw}" height="${Math.max(2,eh)}" rx="5" fill="${accent()}" opacity=".9"/>
    <text x="${cx}" y="${h-10}" text-anchor="middle" fill="${subC()}" font-size="12" font-weight="700">${esc(d.label)}</text>`;
  });
  return html+"</svg>";
}
/* ---------- line (projection) ---------- */
function lineSVG(pts,w=560,h=220){
  const vals=pts.map(p=>p.bal);let min=Math.min(0,...vals),max=Math.max(0,...vals);
  if(max-min<10)max=min+10;
  const X=i=>8+(w-16)*i/(pts.length-1), Y=v=>10+(h-44)*(1-(v-min)/(max-min));
  let d="M"+X(0)+","+Y(pts[0].bal);
  for(let i=1;i<pts.length;i++)d+=" L"+X(i).toFixed(1)+","+Y(pts[i].bal).toFixed(1);
  const zeroY=Y(0);
  let html=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">`;
  html+=`<line x1="0" y1="${zeroY}" x2="${w}" y2="${zeroY}" stroke="var(--bad)" stroke-width="1" stroke-dasharray="5 4" opacity=".7"/>`;
  for(let i=0;i<4;i++){const y=10+(h-44)*i/3;html+=`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${trackC()}" stroke-width="1"/>`;}
  html+=`<path d="${d} L${X(pts.length-1)},${h-30} L${X(0)},${h-30} Z" fill="${accent()}" opacity=".14"/>
  <path d="${d}" fill="none" stroke="${accent()}" stroke-width="2.5" stroke-linejoin="round"/>`;
  const low=vals.indexOf(Math.min(...vals));
  html+=`<circle cx="${X(low)}" cy="${Y(vals[low])}" r="4.5" fill="var(--bad)"/>
  <text x="${clamp(X(low),60,w-60)}" y="${Y(vals[low])-10}" text-anchor="middle" fill="var(--bad)" font-size="12" font-weight="800">Low ${esc(money(vals[low],0))}</text>

  <text x="${w-8}" y="${h-10}" text-anchor="end" fill="${subC()}" font-size="11" font-weight="700">Day ${pts.length-1}</text></svg>`;
  return html;
}

}
function billRow(b,ref){
  const paid=isBillPaid(b,ref),c=catOf(b.cat||"other");
  const due=new Date(ref.getFullYear(),ref.getMonth(),clamp(b.dueDay,1,28));
  const dd=Math.round((due-today())/DAY);
  const badge=paid?'<span class="badge paid">✓ paid</span>':dd<0?'<span class="badge overdue">overdue</span>':dd<=3?'<span class="badge due">due soon</span>':b.autopay?'<span class="badge auto">autopay</span>':"";
  return `<div class="rowitem"><div class="ric" style="background:${c.color}">${b.sub?"🔁":c.icon}</div>
  <div class="rinfo"><div class="t">${esc(b.name)}</div><div class="s">Due ${b.dueDay}${["","st","nd","rd"][b.dueDay]||"th"} · ${badge}</div></div>
  <div class="ramt neg amt">${money(b.amount)}</div>
  ${paid?`<button class="iconbtn" title="Undo paid" onclick="unpayBill('${b.id}')">↩</button>`:`<button class="iconbtn" title="Mark paid" onclick="payBill('${b.id}')">✓</button>`}
  <button class="iconbtn" onclick="mBill('${b.id}')" title="Edit">✎</button>
  <button class="iconbtn" onclick="delBill('${b.id}')" title="Delete">🗑</button></div>`;
}
function payBill(id,datestr){
  const b=S.bills.find(x=>x.id===id);if(!b)return;
  const ref=datestr?parseD(datestr):new Date();
  b.paid=b.paid||{};b.paid[monthKey(ref)]=true;
  // also log the spend + reduce checking
  S.transactions.push({id:uid(),date:dstr(today()),merchant:b.name,cat:b.cat||"other",amount:-Math.abs(Number(b.amount)),note:"bill"});
  S.profile.checking=Math.round(((Number(S.profile.checking)||0)-Number(b.amount))*100)/100;
  save();render();toast(`${b.name} marked paid`);
}
function unpayBill(id){
  const b=S.bills.find(x=>x.id===id);if(!b||!b.paid)return;
  delete b.paid[monthKey(new Date())];save();render();toast("Undone");
}

/* ---------- WHAT-IF ---------- */
let wi={price:250,cat:"shopping"};
function vWhatif(){
  const s=safeToSpend();
  const price=Math.max(0,Number(wi.price)||0);
  const spent=spentByCat(today());
  const env=S.envelopes.find(e=>e.id===wi.cat);
  const envSpent=spent[wi.cat]||0, envCap=env?Number(env.cap):0, envLeft=envCap-envSpent-price;
  const newSafe=s.safe-price;
  const ds=debtSummary();
  const delay=ds.mins+debtExtra>0?(price/(ds.mins+debtExtra)):0;
  let verdict,cls,msg;
  if(newSafe<0){verdict="SKIP IT ⛔";cls="skip";msg=`This puts you ${money(-newSafe,0)} past safe-to-spend. Wait until after payday (${fmtD(dstr(s.np))}).`;}
  else if(env&&envLeft<0){verdict="TIGHT ⚠️";cls="tight";msg=`You can afford it overall, but it busts your ${catOf(wi.cat).label} cap by ${money(-envLeft,0)}. Borrow from another envelope or wait.`;}
  else if(s.perDay>0&&price>s.perDay*3){verdict="THINK 🤔";cls="tight";msg=`That's ${(price/s.perDay).toFixed(1)} days of daily budget in one purchase. Sleep on it — if you still want it tomorrow, go.`;}
  else{verdict="GO FOR IT ✅";cls="go";msg=`Fits your budget with ${money(newSafe,0)} safe-to-spend left. Enjoy it guilt-free!`;}
  $("#view").innerHTML=`
  <div class="view-head"><div><h1>Before you spend 🔮</h1><p>Test any “what if” in seconds — no guilt, no math.</p></div></div>
  <div class="grid g2">
    <div class="card"><h3><span class="q">◈</span> The temptation</h3>
      <label class="lbl">Price: <span id="wiPriceLbl">${money(price,0)}</span></label>
      <input type="range" min="5" max="2000" step="5" value="${clamp(price,5,2000)}" oninput="wi.price=+this.value;document.querySelector('#wiPriceLbl').textContent=money(wi.price,0)" onchange="render()">
      <div class="row2" style="margin-top:10px">
        <div><label class="lbl">Exact price</label><input type="number" min="0" step="0.01" value="${price}" onchange="wi.price=+this.value;render()"></div>
        <div><label class="lbl">Envelope</label><select onchange="wi.cat=this.value;render()">${S.envelopes.map(e=>`<option value="${e.id}" ${e.id===wi.cat?"selected":""}>${catOf(e.id).icon} ${catOf(e.id).label}</option>`).join("")}</select></div>
      </div>
      <div class="verdict ${cls}"><div class="vv">${verdict}</div><div style="margin-top:6px;font-size:14px">${msg}</div></div>
    </div>
    <div class="card"><h3><span class="q">◈</span> Impact breakdown</h3>
      <div class="setrow"><div><div class="t">Safe to spend</div><div class="s">Before → after</div></div><div class="amt" style="font-weight:800">${money(s.safe,0)} → <span class="${newSafe<0?"over":""}">${money(Math.max(0,newSafe),0)}</span></div></div>
      <div class="setrow"><div><div class="t">${catOf(wi.cat).icon} ${catOf(wi.cat).label} envelope</div><div class="s">${money(envSpent,0)} spent of ${money(envCap,0)} cap</div></div><div class="amt" style="font-weight:800" class="${envLeft<0?"over":""}">${money(envLeft,0)} left</div></div>
      <div class="setrow"><div><div class="t">Daily budget drain</div><div class="s">${money(s.perDay,0)}/day until payday</div></div><div style="font-weight:800">${s.perDay>0?(price/s.perDay).toFixed(1)+" days":"—"}</div></div>
      <div class="setrow"><div><div class="t">Debt freedom delay</div><div class="s">If the cash went to debt instead</div></div><div style="font-weight:800">~${delay<0.1?"0":delay.toFixed(1)} mo</div></div>
      <div style="margin-top:14px"><button class="btn primary block" onclick="buyIt()">I bought it — log ${money(price,0)} →</button></div>
    </div>
  </div>`;
}
function buyIt(){
  const price=Math.max(0,Number(wi.price)||0);if(!price){toast("Set a price first");return;}
  S.transactions.push({id:uid(),date:dstr(today()),merchant:"What-If purchase",cat:wi.cat,amount:-price,note:""});
  S.profile.checking=Math.round(((Number(S.profile.checking)||0)-price)*100)/100;
  save();go("spend");toast(`Logged ${money(price)}`);
}

function mTxPaint(keep){
  $$("#txType .chip")[0].classList.toggle("on",txMode==="exp");
  $$("#txType .chip")[1].classList.toggle("on",txMode==="inc");
  if(txMode==="inc")$("#mCatWrap").innerHTML=`<label class="lbl">Type</label><input value="💰 Income" disabled>`;
  else if(!keep||!$("#mCat"))$("#mCatWrap").innerHTML=`<label class="lbl">Envelope</label><select id="mCat">${S.envelopes.map(e=>`<option value="${e.id}">${catOf(e.id).icon} ${catOf(e.id).label}</option>`).join("")}</select>`;
}
function saveTx(id){
  const amt=Math.abs(parseFloat($("#mAmt").value)||0),merch=$("#mMerch").value.trim()||"Untitled";
  const date=$("#mDate").value||dstr(today()),cat=txMode==="inc"?"income":($("#mCat")?$("#mCat").value:"other");
  const note=$("#mNote").value.trim();
  if(!amt){toast("Enter an amount");return;}
  const signed=txMode==="inc"?amt:-amt;
  if(id){const t=S.transactions.find(x=>x.id===id);
    if(t){ // adjust checking by delta
      const oldEff=t.cat==="income"?t.amount:t.amount; // signed already
      S.profile.checking=Math.round(((Number(S.profile.checking)||0)-oldEff+signed)*100)/100;
      Object.assign(t,{merchant:merch,cat,amount:signed,date,note});
    }
  }else{
    S.transactions.push({id:uid(),merchant:merch,cat,amount:signed,date,note});
    S.profile.checking=Math.round(((Number(S.profile.checking)||0)+signed)*100)/100;
  }
  save();closeModal();render();toast("Saved ✓");
}
function delTx(id){if(!confirm("Delete this transaction?"))return;
  const t=S.transactions.find(x=>x.id===id);
  if(t)S.profile.checking=Math.round(((Number(S.profile.checking)||0)-t.amount)*100)/100;
  S.transactions=S.transactions.filter(x=>x.id!==id);save();render();toast("Deleted");}

/* ---------- debt modal ---------- */
function mDebt(id){
  const d=id?S.debts.find(x=>x.id===id):null;
  openModal(`<h2>${d?"Edit":"Add"} debt</h2><div class="msub">The simulator does the snowball math for you.</div>
  <label class="lbl">Name</label><input id="dName" value="${d?esc(d.name):""}" placeholder="e.g. Visa •• 4412">
  <label class="lbl">Balance owed</label><input id="dBal" type="number" step="0.01" min="0" value="${d?d.balance:""}" placeholder="0.00">
  <div class="row2"><div><label class="lbl">APR %</label><input id="dApr" type="number" step="0.1" min="0" value="${d?d.apr:""}"></div>
  <div><label class="lbl">Min / month</label><input id="dMin" type="number" step="0.01" min="0" value="${d?d.min:""}" placeholder="0.00"></div></div>
  <div class="mrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveDebt('${id||""}')">Save ✓</button></div>`);
}
function saveDebt(id){
  const name=$("#dName").value.trim()||"Debt",balance=Math.abs(parseFloat($("#dBal").value)||0);
  const apr=Math.abs(parseFloat($("#dApr").value)||0),min=Math.abs(parseFloat($("#dMin").value)||0);
  if(!balance){toast("Enter a balance");return;}
  if(id)Object.assign(S.debts.find(x=>x.id===id),{name,balance,apr,min});
  else S.debts.push({id:uid(),name,balance,apr,min});
  save();closeModal();render();toast("Debt saved ✓");
}
function delDebt(id){if(!confirm("Delete this debt?"))return;S.debts=S.debts.filter(x=>x.id!==id);save();render();toast("Deleted");}

/* ---------- goal modals ---------- */
const GOAL_COLORS=["#d8b45a","#38bdf8","#f472b6","#4ade80","#a78bfa","#fb923c","#2dd4bf","#f87171"];
function mGoal(id){
  const g=id?S.goals.find(x=>x.id===id):null;
  openModal(`<h2>${g?"Edit":"New"} savings goal</h2><div class="msub">Name it. Fund it. Watch the bar move.</div>
  <label class="lbl">Goal name</label><input id="gName" value="${g?esc(g.name):""}" placeholder="e.g. Japan Trip ✈️">
  <div class="row2"><div><label class="lbl">Target</label><input id="gT" type="number" step="0.01" min="0" value="${g?g.target:""}" placeholder="0.00"></div>
  <div><label class="lbl">Saved so far</label><input id="gS" type="number" step="0.01" min="0" value="${g?g.saved:0}"></div></div>
  <label class="lbl">Deadline (optional)</label><input id="gD" type="date" value="${g&&g.deadline?g.deadline:""}">
  <label class="lbl">Color</label><div class="chips">${GOAL_COLORS.map(c=>`<span class="chip ${g&&g.color===c?"on":""}" style="background:${c};color:#fff;border:0" onclick="pickGoalColor('${c}',this)">●</span>`).join("")}</div>
  <div class="mrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveGoal('${id||""}')">Save ✓</button></div>`);
  window._gc=g?g.color:GOAL_COLORS[0];
}
function pickGoalColor(c,el){window._gc=c;$$("#modalBox .chip").forEach(x=>x.classList.remove("on"));el.classList.add("on");}
function saveGoal(id){
  const name=$("#gName").value.trim()||"My goal",target=Math.abs(parseFloat($("#gT").value)||0);
  const saved=Math.abs(parseFloat($("#gS").value)||0),deadline=$("#gD").value||"";
  if(!target){toast("Enter a target");return;}
  if(id)Object.assign(S.goals.find(x=>x.id===id),{name,target,saved,deadline,color:window._gc});
  else S.goals.push({id:uid(),name,target,saved,deadline,color:window._gc,icon:"🎯"});
  save();closeModal();render();toast("Goal saved ✓");
}
function delGoal(id){if(!confirm("Delete this goal?"))return;S.goals=S.goals.filter(x=>x.id!==id);save();render();toast("Deleted");}
function mContrib(id){
  const g=S.goals.find(x=>x.id===id);if(!g)return;
  openModal(`<h2>＋ Add to ${esc(g.name)}</h2><div class="msub"><span class="amt">${money(g.saved,0)}</span> of <span class="amt">${money(g.target,0)}</span> · <span class="amt">${money(Math.max(0,g.target-g.saved),0)}</span> to go</div>
  <label class="lbl">Amount</label><input id="cAmt" type="number" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
  <div class="mrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveContrib('${id}')">Add ✓</button></div>`);
  setTimeout(()=>$("#cAmt").focus(),50);
}
function saveContrib(id){
  const g=S.goals.find(x=>x.id===id),amt=Math.abs(parseFloat($("#cAmt").value)||0);
  if(!amt){toast("Enter an amount");return;}
  g.saved=Math.round((Number(g.saved)+amt)*100)/100;
  S.transactions.push({id:uid(),date:dstr(today()),merchant:"→ "+g.name,cat:"other",amount:-amt,note:"savings"});
  S.profile.checking=Math.round(((Number(S.profile.checking)||0)-amt)*100)/100;
  save();closeModal();render();toast(`Added ${money(amt)} 🎉${g.saved>=g.target?" — GOAL REACHED! 🏆":""}`);
}

/* ---------- envelope modal ---------- */
function mEnvelope(){
  const avail=Object.keys(CATS).filter(k=>k!=="income"&&!S.envelopes.find(e=>e.id===k));
  openModal(`<h2>Add envelope</h2><div class="msub">Give every dollar a category + a monthly cap.</div>
  ${avail.length?`<label class="lbl">Category</label><select id="eCat">${avail.map(k=>`<option value="${k}">${CATS[k].icon} ${CATS[k].label}</option>`).join("")}</select>
  <label class="lbl">Monthly cap</label><input id="eCap" type="number" step="10" min="0" value="150">
  <div class="mrow"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEnv()">Add ✓</button></div>`
  :'<div class="empty"><span class="big">✉️</span>All categories already have envelopes.</div><div class="mrow"><button class="btn primary" onclick="closeModal()">Done</button></div>'}`);
}
function saveEnv(){const id=$("#eCat").value,cap=Math.abs(parseFloat($("#eCap").value)||0);
  S.envelopes.push({id,cap});save();closeModal();render();toast("Envelope added ✓");}

/* ---------- export / import ---------- */
function download(name,text,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function exportJSON(){download("truespend-backup-"+dstr(today())+".json",JSON.stringify(S,null,1),"application/json");toast("Backup downloaded ⬇");}
function exportCSV(){
  const rows=[["Date","Merchant","Category","Amount","Note"]];
  for(const t of S.transactions.slice().sort((a,b)=>a.date<b.date?-1:1))
    rows.push([t.date,'"'+String(t.merchant).replace(/"/g,'""')+'"',catOf(t.cat).label,t.amount,'"'+String(t.note||"").replace(/"/g,'""')+'"']);
  download("truespend-transactions.csv",rows.map(r=>r.join(",")).join("\n"),"text/csv");toast("CSV downloaded ⬇");
}
$("#fileInput").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d.profile||!Array.isArray(d.transactions))throw 0;
      S=d;save();render();toast("Backup restored ✓");
    }catch(err){toast("That file didn't work");}};
  r.readAsText(f);e.target.value="";
});

/* =====================================================================
   Wizard (first run)
===================================================================== */
let wz={step:0,name:"",currency:"USD",theme:"midnight",freq:"biweekly",nextPayday:dstr(addDays(today(),7)),payAmount:"",checking:""};
function showWizard(){
  const w=$("#wizard");w.classList.remove("hidden");
  const steps=["👋 Welcome","💵 Payday","🎨 Theme"];
  let body="";
  if(wz.step===0)body=`<h1>Meet TrueSpend ◈</h1><div class="wsub">Your entire budget — safe-to-spend, bills, debts & goals — in one private file. 60-second setup.</div>
    <label class="lbl">Who should we call you?</label><input id="wName" value="${esc(wz.name)}" placeholder="e.g. Alex" oninput="wz.name=this.value">
    <label class="lbl">Currency</label><select onchange="wz.currency=this.value">${Object.keys(CURS).map(k=>`<option ${wz.currency===k?"selected":""} value="${k}">${k} (${CURS[k].s})</option>`).join("")}</select>
    <div class="wnav"><button class="btn ghost" onclick="wzDemo()">Explore demo first</button><button class="btn primary" onclick="wz.step=1;showWizard()">Next →</button></div>`;
  if(wz.step===1)body=`<h1>Payday setup 💵</h1><div class="wsub">This powers your safe-to-spend number + forecast.</div>
    <div class="row2"><div><label class="lbl">Pay frequency</label><select onchange="wz.freq=this.value">${["weekly","biweekly","semimonthly","monthly"].map(f=>`<option ${wz.freq===f?"selected":""} value="${f}">${f}</option>`).join("")}</select></div>
    <div><label class="lbl">Next payday</label><input type="date" value="${wz.nextPayday}" onchange="wz.nextPayday=this.value"></div></div>
    <div class="row2"><div><label class="lbl">Paycheck amount</label><input type="number" min="0" step="0.01" value="${wz.payAmount}" placeholder="0.00" oninput="wz.payAmount=this.value"></div>
    <div><label class="lbl">Checking balance</label><input type="number" step="0.01" value="${wz.checking}" placeholder="0.00" oninput="wz.checking=this.value"></div></div>
    <div class="wnav"><button class="btn ghost" onclick="wz.step=0;showWizard()">← Back</button><button class="btn primary" onclick="wz.step=2;showWizard()">Next →</button></div>`;
  if(wz.step===2)body=`<h1>Pick your vibe 🎨</h1><div class="wsub">6 themes included. Change anytime in Settings.</div>
    <div class="themes">${[["midnight","Midnight Gold","linear-gradient(135deg,#0d1017 60%,#d8b45a)"],["vault","Vault Green","linear-gradient(135deg,#0a1511 60%,#c9a24b)"],["paper","Paper Light","linear-gradient(135deg,#f4efe6 60%,#b07a2e)"],["blush","Blush Noir","linear-gradient(135deg,#160f16 60%,#e5a4c4)"],["ocean","Ocean","linear-gradient(135deg,#08131f 60%,#38bdf8)"],["lavender","Lavender Mist","linear-gradient(135deg,#efeef7 60%,#6d5bd0)"]].map(([id,n,sw])=>`<div class="theme-pick ${wz.theme===id?"on":""}" onclick="wz.theme='${id}';showWizard()"><div class="sw" style="background:${sw}"></div><div class="tn">${n}</div></div>`).join("")}</div>
    <div class="wnav"><button class="btn ghost" onclick="wz.step=1;showWizard()">← Back</button><button class="btn primary" onclick="wzFinish()">Start budgeting →</button></div>`;
  w.innerHTML=`<div class="wizard-card"><div class="brand"><span class="brand-mark">◈</span><div><div class="brand-name">TrueSpend</div><div class="brand-sub">BUDGET COMMAND CENTER</div></div></div>
  <div class="wsteps"><i class="${wz.step>=0?"on":""}"></i><i class="${wz.step>=1?"on":""}"></i><i class="${wz.step>=2?"on":""}"></i></div>
  <div style="font-size:12px;font-weight:800;color:var(--sub);letter-spacing:1px">STEP ${wz.step+1} OF 3 · ${steps[wz.step]}</div>${body}</div>`;
}
function wzDemo(){resetDemo();$("#wizard").classList.add("hidden");render();}
function wzFinish(){
  freshStart();
  S.setupDone=true;
  S.profile.name=wz.name;S.profile.currency=wz.currency;S.profile.theme=wz.theme;
  S.profile.freq=wz.freq;S.profile.nextPayday=wz.nextPayday;
  S.profile.payAmount=Math.abs(parseFloat(wz.payAmount)||0);
  S.profile.checking=parseFloat(wz.checking)||0;
  if(wz.name)S.incomes=[{id:uid(),name:"Paycheck",amount:S.profile.payAmount,freq:wz.freq}];
  save();$("#wizard").classList.add("hidden");render();
  toast("Welcome"+(wz.name?", "+wz.name:"")+"! 🎉");
}

/* =====================================================================
   Init
===================================================================== */
function init(){
  load();CUR=S.profile.currency||"USD";
  $("#btnSimple").onclick=()=>{$("#simpleOverlay").classList.remove("hidden");updateSimple();};
  $("#btnSimpleExit").onclick=()=>$("#simpleOverlay").classList.add("hidden");
  const tog=()=>{S.profile.privacy=!S.profile.privacy;save();applyTheme();toast(S.profile.privacy?"Privacy on 👁":"Privacy off");};
  $("#btnPrivacy").onclick=tog;$("#btnPrivacyM").onclick=tog;
  $("#btnQuickAdd").onclick=()=>mTx();
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();$("#simpleOverlay").classList.add("hidden");}});
  render();
  if(!S.setupDone)showWizard();
}
document.addEventListener("DOMContentLoaded",init);

</script>
