<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<title>TrueSpend — Budget Command Center</title>
<style>
/*__STYLES__*/
</style>
</head>
<body>
<div id="app" class="app">
  <!-- Sidebar (desktop) -->
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">◈</span><div><div class="brand-name">TrueSpend</div><div class="brand-sub">Budget Command Center</div></div></div>
    <nav class="nav" id="mainNav"></nav>
    <div class="side-foot">
      <button class="btn ghost sm" id="btnSimple">◉ Simple view</button>
      <button class="btn ghost sm" id="btnPrivacy">👁 Privacy</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div class="brand mini"><span class="brand-mark">◈</span><span class="brand-name">TrueSpend</span></div>
      <div class="topbar-right">
        <span class="pay-pill" id="payPill"></span>
        <button class="btn ghost sm" id="btnPrivacyM">👁</button>
        <button class="btn primary sm" id="btnQuickAdd">＋ Log</button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>

  <!-- Bottom nav (mobile) -->
  <nav class="bottomnav" id="bottomNav"></nav>
</div>

<!-- Simple mode overlay -->
<div class="simple-overlay hidden" id="simpleOverlay">
  <div class="simple-card">
    <div class="simple-label">SAFE TO SPEND</div>
    <div class="simple-amount amt" id="simpleAmount">$0</div>
    <div class="simple-sub" id="simpleSub"></div>
    <div class="simple-row">
      <button class="btn primary" id="btnSimpleExit">Full dashboard</button>
    </div>
  </div>
</div>

<!-- Wizard overlay -->
<div class="wizard-overlay hidden" id="wizard"></div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modalOverlay"><div class="modal" id="modalBox" role="dialog"></div></div>

<!-- Toast -->
<div class="toast hidden" id="toast"></div>

<input type="file" id="fileInput" accept="application/json" class="hidden">
<script>
/*__APPJS__*/
</script>
</body>
</html>
