<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Waypoint — Interactive Budget Dashboard</title>
<meta name="description" content="Offline interactive budget dashboard: safe-to-spend, payday planner, bill calendar, envelope budgets, debt payoff and savings goals. No account, no subscription, works in any browser.">
<style>
/* ==========================================================================
   Waypoint Budget Studio — design system
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0a0e13; --bg-grad:radial-gradient(1200px 700px at 12% -8%,rgba(245,196,81,.10),transparent 60%),
                          radial-gradient(900px 600px at 100% 0%,rgba(125,211,252,.07),transparent 55%);
  --surface:#121a23; --surface-2:#17212c; --surface-3:#1d2836;
  --line:#233040; --line-soft:rgba(255,255,255,.06);
  --grid:rgba(255,255,255,.06); --track:rgba(255,255,255,.09); --tick:rgba(255,255,255,.22);
  --text:#e9f0f8; --muted:#93a6ba; --dim:#6b7f94;
  --accent:#f5c451; --accent-ink:#1a1305; --accent-2:#7dd3fc;
  --good:#4ade80; --warn:#fbbf24; --danger:#f87171;
  --radius:16px; --radius-sm:11px; --radius-lg:22px;
  --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  --shadow-sm:0 6px 18px -10px rgba(0,0,0,.7);
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="daylight"]{
  --bg:#f4f6fa; --bg-grad:radial-gradient(1100px 620px at 10% -10%,rgba(79,70,229,.10),transparent 60%),
                          radial-gradient(900px 560px at 100% 0%,rgba(14,165,233,.10),transparent 55%);
  --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eef2f8;
  --line:#e2e8f0; --line-soft:rgba(15,23,42,.06);
  --grid:rgba(15,23,42,.07); --track:rgba(15,23,42,.09); --tick:rgba(15,23,42,.25);
  --text:#101a2b; --muted:#5a6b81; --dim:#8a99ac;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-2:#0ea5e9;
  --good:#16a34a; --warn:#d97706; --danger:#dc2626;
  --shadow:0 18px 40px -22px rgba(16,26,43,.30);
  --shadow-sm:0 8px 20px -12px rgba(16,26,43,.28);
  color-scheme:light;
}
html[data-theme="vault"]{
  --bg:#06110e; --bg-grad:radial-gradient(1100px 620px at 8% -10%,rgba(52,211,153,.14),transparent 60%),
                          radial-gradient(900px 560px at 100% 0%,rgba(163,230,53,.07),transparent 55%);
  --surface:#0b1a16; --surface-2:#0f231d; --surface-3:#142c25;
  --line:#1d3a31; --grid:rgba(255,255,255,.06); --track:rgba(255,255,255,.09); --tick:rgba(255,255,255,.22);
  --text:#e6f5ef; --muted:#8db3a6; --dim:#5d8176;
  --accent:#34d399; --accent-ink:#04241a; --accent-2:#a3e635;
  --good:#4ade80; --warn:#fbbf24; --danger:#fb7185;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8);
}
html[data-theme="blush"]{
  --bg:#140d12; --bg-grad:radial-gradient(1100px 620px at 10% -10%,rgba(244,114,182,.16),transparent 60%),
                          radial-gradient(900px 560px at 100% 0%,rgba(192,132,252,.10),transparent 55%);
  --surface:#1d1319; --surface-2:#261923; --surface-3:#2f1f2c;
  --line:#3a2634; --grid:rgba(255,255,255,.06); --track:rgba(255,255,255,.1); --tick:rgba(255,255,255,.22);
  --text:#fbeef5; --muted:#c39bb0; --dim:#96738a;
  --accent:#f472b6; --accent-ink:#2a0716; --accent-2:#c084fc;
  --good:#86efac; --warn:#fdba74; --danger:#fb7185;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8);
}
html[data-theme="paper"]{
  --bg:#f6f1e7; --bg-grad:radial-gradient(1100px 620px at 8% -10%,rgba(180,83,9,.10),transparent 60%),
                          radial-gradient(900px 560px at 100% 0%,rgba(20,83,45,.08),transparent 55%);
  --surface:#fffdf8; --surface-2:#f8f3ea; --surface-3:#efe7da;
  --line:#e3d9c8; --grid:rgba(60,42,20,.08); --track:rgba(60,42,20,.10); --tick:rgba(60,42,20,.25);
  --text:#2b2115; --muted:#77664f; --dim:#9b8b74;
  --accent:#b45309; --accent-ink:#fffaf2; --accent-2:#0f766e;
  --good:#15803d; --warn:#b45309; --danger:#b91c1c;
  --shadow:0 18px 40px -22px rgba(43,33,21,.32);
  --shadow-sm:0 8px 20px -12px rgba(43,33,21,.28);
  color-scheme:light;
}
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); background-image:var(--bg-grad); background-attachment:fixed;
  color:var(--text); font-family:var(--font); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent-2)}
::selection{background:var(--accent);color:var(--accent-ink)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.amt{white-space:nowrap}
body.privacy .amt,body.privacy .chart-axis,body.privacy .heat{filter:blur(7px);transition:filter .18s}
body.privacy .amt{cursor:pointer}

/* ------------------------------------------------------------ scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ---------------------------------------------------------------- shell */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
  padding:20px 14px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,transparent);
  backdrop-filter:blur(12px);z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 14px}
.brand .mark{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 45%,var(--accent-2)));
  color:var(--accent-ink);box-shadow:0 6px 16px -8px var(--accent);
}
.brand .mark svg{width:19px;height:19px}
.brand b{font-size:15.5px;letter-spacing:-.02em;display:block;line-height:1.15}
.brand small{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-sm);
  color:var(--muted);font-weight:550;font-size:14px;transition:.14s;position:relative;width:100%;text-align:left
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.on{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.nav-item.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-item .ico{width:18px;height:18px;flex:0 0 auto;opacity:.9}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--danger);color:#fff}
.nav-item .badge.soft{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.payday-card{
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;
  background:linear-gradient(160deg,var(--surface-2),color-mix(in srgb,var(--surface) 80%,transparent));
}
.payday-card .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
.payday-card .big{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.payday-card .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.payday-card .count{
  display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11.5px;font-weight:600;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:3px 9px;border-radius:20px
}
.side-actions{display:flex;gap:6px}
.side-actions button{flex:1;display:grid;place-items:center;height:34px;border-radius:10px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2);transition:.14s}
.side-actions button:hover{color:var(--text);border-color:var(--muted)}
.side-actions button.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.side-actions svg{width:16px;height:16px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:12px;
  padding:14px 26px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px) saturate(1.3);
}
.topbar .titles{min-width:0}
.topbar h1{font-size:19px;letter-spacing:-.02em}
.topbar .crumb{font-size:12px;color:var(--dim);margin-top:1px}
.qa{
  margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 1 460px;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:0 6px 0 12px;height:44px;
  transition:.15s;
}
.qa:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
.qa svg{width:17px;height:17px;color:var(--dim);flex:0 0 auto}
.qa input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;font-size:14px}
.qa input::placeholder{color:var(--dim)}
.qa kbd{
  font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line);
  border-radius:6px;padding:2px 6px;background:var(--surface-2)
}
.top-actions{display:flex;gap:8px;align-items:center}

.view{padding:22px 26px 90px;max-width:1560px;width:100%;margin:0 auto;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabbar{display:none}

/* ------------------------------------------------------------- primitives */
.card{
  background:linear-gradient(168deg,var(--surface),color-mix(in srgb,var(--surface-2) 55%,var(--surface)));
  border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);
  position:relative;min-width:0;
}
.card.pad-sm{padding:14px}
.card h2,.card h3{font-size:14px;letter-spacing:-.01em}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head .t{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.card-head .s{font-size:11.5px;color:var(--dim)}
.card-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:16px}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-32{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-23{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.tiny{font-size:11.5px}
.small{font-size:12.5px}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.good{color:var(--good)} .warn{color:var(--warn)} .danger{color:var(--danger)} .accent{color:var(--accent)}
.center{text-align:center}
.hidden{display:none !important}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;
  border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);
  font-weight:600;font-size:13.5px;transition:.14s;white-space:nowrap
}
.btn:hover{border-color:var(--muted);transform:translateY(-1px)}
.btn:active{transform:none}
.btn svg{width:16px;height:16px}
.btn.sm{height:31px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn.xs{height:26px;padding:0 9px;font-size:11.5px;border-radius:8px;gap:5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -14px var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 14%,transparent)}
.btn.link{border:0;background:none;color:var(--accent-2);height:auto;padding:0}
.btn.icon{width:36px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;
  background:var(--surface-3);color:var(--muted);border:1px solid var(--line-soft);white-space:nowrap
}
.chip.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent);border-color:transparent}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:transparent}
.chip.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent);border-color:transparent}
.chip.accent{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:transparent}
.chip.ghost{background:transparent}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill-group{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.pill-group button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.14s}
.pill-group button.on{background:var(--surface-3);color:var(--text);box-shadow:var(--shadow-sm)}
.pill-group button:hover:not(.on){color:var(--text)}

input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;height:40px;padding:0 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface-2);outline:0;transition:.14s;font-size:14px
}
textarea{height:auto;padding:10px 12px;resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 11%,transparent)}
label.field{display:block}
label.field .lb{display:block;font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:20px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:20px;background:var(--track)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .slider{width:42px;height:24px;border-radius:20px;background:var(--track);transition:.18s;position:relative;flex:0 0 auto}
.switch .slider::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.18s}
.switch input:checked + .slider{background:color-mix(in srgb,var(--accent) 34%,transparent)}
.switch input:checked + .slider::after{transform:translateX(18px);background:var(--accent)}
.switch .txt{font-size:13px;font-weight:550}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.check input{width:17px;height:17px;accent-color:var(--accent)}

.bar-track{height:9px;border-radius:20px;background:var(--track);overflow:hidden;position:relative}
.bar-track.thin{height:6px}
.bar-fill{display:block;height:100%;border-radius:20px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar-fill.over{background:var(--danger) !important}
.bar-fill.good{background:var(--good)}

table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);text-align:left;font-weight:700;padding:0 10px 9px 0;white-space:nowrap}
td{padding:9px 10px 9px 0;border-top:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
td.r,th.r{text-align:right;padding-right:0}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line-soft);transition:.12s;border-radius:9px}
.li:first-child{border-top:0}
.li:hover{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.li .ic{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;
  background:var(--surface-3);border:1px solid var(--line-soft)
}
.li .tx{min-width:0;flex:1}
.li .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{font-size:11.5px;color:var(--dim)}
.li .va{font-weight:650;font-variant-numeric:tabular-nums;font-size:13.5px}
.li .acts{display:flex;gap:4px;opacity:0;transition:.14s}
.li:hover .acts,.li:focus-within .acts{opacity:1}
.li.dim-row{opacity:.5}
.day-sep{display:flex;align-items:center;gap:10px;padding:12px 0 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:700}
.day-sep::after{content:"";flex:1;height:1px;background:var(--line-soft)}

.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:30px 18px;color:var(--dim)}
.empty .em{font-size:30px;opacity:.7}
.empty b{color:var(--muted);font-size:14px}

/* ------------------------------------------------------------- dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px}
.safe-card{
  background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface) 62%);
  border:1px solid color-mix(in srgb,var(--accent) 26%,var(--line));
  overflow:hidden;
}
.safe-card::after{
  content:"";position:absolute;right:-90px;top:-90px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 68%);pointer-events:none
}
.safe-main{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.safe-num{font-size:clamp(38px,5.4vw,60px);font-weight:750;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.safe-sub{font-size:13px;color:var(--muted);margin-top:8px;max-width:44ch}
.safe-perday{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ledger{border-top:1px dashed var(--line);margin-top:16px;padding-top:12px;display:none}
.ledger.open{display:block;animation:fade .2s}
.ledger-row{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:13px}
.ledger-row b{font-variant-numeric:tabular-nums;font-weight:600}
.ledger-row.total{border-top:1px solid var(--line);margin-top:7px;padding-top:9px;font-weight:700}
.ledger-row .lbl{color:var(--muted)}
.ledger-foot{font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.45}

.metric{padding:15px 16px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line-soft)}
.metric .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700}
.metric .v{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.metric .d{font-size:11.5px;color:var(--muted);margin-top:3px}

.alert{
  display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;font-size:13px;
  background:var(--surface-2);border:1px solid var(--line);border-left-width:3px
}
.alert.warn{border-left-color:var(--warn)}
.alert.danger{border-left-color:var(--danger)}
.alert.good{border-left-color:var(--good)}
.alert.info{border-left-color:var(--accent-2)}
.alert .em{font-size:16px;flex:0 0 auto}
.alert b{font-weight:650}

.chart{display:block;width:100%;height:auto;overflow:visible}
.chart-axis{font-size:10.5px;fill:var(--dim);font-family:var(--font)}
.chart-axis.warn{fill:var(--warn)} .chart-axis.danger{fill:var(--danger)}
.chart-empty{font-size:12px;fill:var(--dim)}
.chart-line .line-main{stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw 1.35s cubic-bezier(.25,.7,.25,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart-gauge .gauge-value{animation:fade .5s ease}
.heat{display:flex;gap:3px;flex-wrap:wrap}
.heat-cell{width:100%;max-width:22px;aspect-ratio:1;border-radius:4px;flex:1 0 12px}

.legend{display:flex;flex-direction:column;gap:8px}
.legend-item{display:flex;align-items:center;gap:9px;font-size:13px}
.legend-item .sw{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.legend-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-item .vl{font-variant-numeric:tabular-nums;font-weight:600}

.env-card{display:flex;flex-direction:column;gap:11px}
.env-head{display:flex;align-items:center;gap:10px}
.env-head .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--surface-3);border:1px solid var(--line-soft)}
.env-head .nm{font-size:13.5px;font-weight:600}
.env-head .amt{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:650;font-size:13.5px}
.env-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim)}

.goal-card{display:flex;gap:14px;align-items:center}
.goal-card .meta{min-width:0;flex:1}
.goal-ring{position:relative;width:78px;height:78px;flex:0 0 auto}
.goal-ring .chart{position:absolute;inset:0}
.goal-ring .pc{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dow{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-bottom:4px}
.cal .day{
  min-height:84px;border-radius:11px;border:1px solid var(--line-soft);background:var(--surface-2);
  padding:6px 7px;display:flex;flex-direction:column;gap:3px;position:relative;transition:.12s;cursor:pointer;text-align:left
}
.cal .day:hover{border-color:var(--accent);transform:translateY(-1px)}
.cal .day.out{opacity:.34}
.cal .day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .day .d{font-size:12px;font-weight:700;color:var(--muted)}
.cal .day .ev{font-size:10.5px;display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal .day .ev.pay{color:var(--good)} .cal .day .ev.bill{color:var(--muted)}
.cal .day .tot{margin-top:auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.cal .day .dots{display:flex;gap:3px;flex-wrap:wrap}
.cal .day .dots i{width:5px;height:5px;border-radius:50%;background:var(--muted)}
.cal .day .dots i.pay{background:var(--good)}

.heatmap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:3px}
.heatmap-grid span{aspect-ratio:1;border-radius:3px;background:var(--track)}

/* ---------------------------------------------------------------- modal */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(4,7,11,.66);backdrop-filter:blur(3px);animation:fade .18s}
.modal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(620px,calc(100vw - 28px));max-height:calc(100vh - 60px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  animation:pop .2s cubic-bezier(.2,.9,.3,1.1);padding:22px
}
.modal.wide{width:min(880px,calc(100vw - 28px))}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.modal-x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--dim)}
.modal-x:hover{background:var(--surface-2);color:var(--text)}

#toast-root{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:13px;
  background:var(--surface-3);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;
  animation:slidein .26s cubic-bezier(.2,.9,.3,1.1);max-width:min(420px,92vw)
}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.toast.out{animation:slideout .22s forwards}
@keyframes slideout{to{opacity:0;transform:translateX(18px)}}
.toast.warn{border-left:3px solid var(--warn)} .toast.ok{border-left:3px solid var(--good)}
.toast.err{border-left:3px solid var(--danger)}
.toast .undo{margin-left:6px;color:var(--accent-2);font-weight:650;font-size:12.5px}

/* ----------------------------------------------------------------- tour */
#tour-root{position:fixed;inset:0;z-index:140;display:none}
#tour-root.on{display:block}
.tour-scrim{position:absolute;inset:0;background:rgba(4,7,11,.55)}
.tour-spot{position:absolute;border-radius:16px;box-shadow:0 0 0 9999px rgba(4,7,11,.55);border:2px solid var(--accent);transition:.3s;pointer-events:none}
.tour-pop{
  position:absolute;width:min(340px,92vw);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);animation:pop .2s
}
.tour-pop h4{font-size:14.5px;margin-bottom:5px}
.tour-pop p{font-size:13px;color:var(--muted);line-height:1.5}

/* --------------------------------------------------------- responsive */
@media (max-width:1180px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-32,.g-23{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  .sidebar{display:none}
  .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar{padding:12px 16px}
  .qa{flex:1 1 auto;order:3;width:100%}
  .topbar{flex-wrap:wrap}
  .view{padding:16px 14px 110px}
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));justify-content:space-around
  }
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--dim);padding:4px 8px;border-radius:10px;font-weight:600}
  .tabbar button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .tabbar svg{width:19px;height:19px}
  #toast-root{left:14px;right:14px;bottom:76px;align-items:stretch}
  .toast{max-width:none}
}
@media (max-width:640px){
  .g-3,.g-4,.g-2{grid-template-columns:minmax(0,1fr)}
  .safe-num{font-size:40px}
  .cal .day{min-height:62px;padding:4px}
  .cal .day .ev{display:none}
  th.hide-xs,td.hide-xs{display:none}
  .modal{padding:18px;border-radius:18px}
  .view{padding:14px 12px 110px}
}
@media (min-width:641px) and (max-width:900px){ .g-2{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media print{ .sidebar,.topbar,.tabbar,#toast-root,.no-print{display:none !important} body{background:#fff;color:#000} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.001s !important;transition-duration:.001s !important} }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="5.2"/><path d="M12 9.4v2.6l1.8 1.4"/>
        </svg>
      </span>
      <span>
        <b id="brandName">Waypoint</b>
        <small>Budget Studio</small>
      </span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="payday-card" id="sidePayday"></div>
      <div class="side-actions">
        <button data-act="togglePrivacy" title="Privacy goggles — hide every amount" aria-label="Privacy goggles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button data-act="cycleTheme" title="Switch theme" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18 4.5 4.5 0 0 0 0-9 4.5 4.5 0 0 1 0-9Z"/></svg>
        </button>
        <button data-act="go" data-view="settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6h.1A1.7 1.7 0 0 0 10.3 3V3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="titles">
        <h1 id="pageTitle">Today</h1>
        <div class="crumb" id="pageCrumb"></div>
      </div>
      <form class="qa" id="quickAdd" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <input type="text" id="qaInput" placeholder="Log a spend… try 14.50 lunch #dining" aria-label="Quick add">
        <kbd>Enter</kbd>
      </form>
      <div class="top-actions">
        <button class="btn primary" data-act="addTx">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="hide-xs">Add</span>
        </button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="tour-root"></div>

<script src="src/js/store.js"></script>
<script src="src/js/engine.js"></script>
<script src="src/js/charts.js"></script>
<script src="src/js/app.js"></script>
<script src="src/js/views.js"></script>
</body>
</html>
