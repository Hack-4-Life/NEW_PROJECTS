  <text x="112" y="258" font-family="Inter" font-size="27" font-weight="700" fill="#f5c451" letter-spacing="4">YOUR MONEY, YOUR BUSINESS</text>
  <text x="110" y="348" font-family="Inter" font-size="76" font-weight="800" fill="#e9f0f8">No account. No cloud.</text><text x="110" y="436" font-family="Inter" font-size="76" font-weight="800" fill="#e9f0f8">No monthly fee.</text>
  
