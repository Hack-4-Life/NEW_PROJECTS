  <text x="190" y="655" font-family="Inter" font-size="30" font-weight="700" fill="#647689" letter-spacing="5">BUILT TO BE TRUSTED</text>
  <rect x="190" y="660" width="770" height="300" rx="30" fill="rgba(255,255,255,0.04)"/><rect x="234" y="702" width="64" height="64" rx="19.2" fill="#f5c451" opacity="0.18"/><circle cx="266" cy="734" r="12.8" fill="#f5c451"/><text x="234" y="828" font-family="Inter" font-size="40" font-weight="800" fill="#e9f0f8">No account. Ever.</text><text x="234" y="878" font-family="Inter" font-size="27" font-weight="500" fill="#93a6ba">Nothing to sign up for, nobody to log in</text><text x="234" y="914" font-family="Inter" font-size="27" font-weight="500" fill="#93a6ba">as. It opens instantly.</text><rect x="1000" y="660" width="770" height="300" rx="30" fill="rgba(255,255,255,0.04)"/><rect x="1044" y="702" width="64" height="64" rx="19.2" fill="#7dd3fc" opacity="0.18"/><circle cx="1076" cy="734" r="12.8" fill="#7dd3fc"/><text x="1044" y="828" font-family="Inter" font-size="40" font-weight="800" fill="#e9f0f8">Works with Wi-Fi off</text><text x="1044" y="878" font-family="Inter" font-size="27" font-weight="500" fill="#93a6ba">One self-contained file. Aeroplane mode,</text><text x="1044" y="914" font-family="Inter" font-size="27" font-weight="500" fill="#93a6ba">a USB stick, a cabin — all fine.</text><rect x="190" y="990" width="770" height="300" rx="30" fill="rgba(255,255,255,0.04)"/><rect x="234" y="1032" width="64" height="64" rx="19.2" fill="#34d399" opacity="0.18"/><circle cx="266" cy="1064" r="12.8" fill="#34d399"/><text x="234" y="1158" font-family="Inter" font-size="40" font-weight="800" fill="#e9f0f8">No subscription</text><text x="234" y="1208" font-family="Inter" font-size="27" font-weight="500" fill="#93a6ba">Buy it once. No monthly fee, no premium</text><text x="234" y="1244" font-family="Inter" font-size="27" font-weight="500" fill="#93a6ba">tier, no ads, no export paywall.</text><rect x="1000" y="990" width="770" height="300" rx="30" fill="rgba(255,255,255,0.04)"/><rect x="1044" y="1032" width="64" height="64" rx="19.2" fill="#f472b6" opacity="0.18"/><circle cx="1076" cy="1064" r="12.8" fill="#f472b6"/><text x="1044" y="1158" font-family="Inter" font-size="40" font-weight="800" fill="#e9f0f8">Yours for good</text><text x="1044" y="1208" font-family="Inter" font-size="27" font-weight="500" fill="#93a6ba">Five themes, any currency, CSV export and</text><text x="1044" y="1244" font-family="Inter" font-size="27" font-weight="500" fill="#93a6ba">a full backup file.</text>
  <text x="190" y="1330" font-family="Inter" font-size="28" font-weight="700" fill="#647689" letter-spacing="4">FIVE THEMES INCLUDED</text>
