  <text x="110" y="348" font-family="Inter" font-size="76" font-weight="800" fill="#e9f0f8">The old way, or the</text><text x="110" y="436" font-family="Inter" font-size="76" font-weight="800" fill="#e9f0f8">way it should be.</text>
  
