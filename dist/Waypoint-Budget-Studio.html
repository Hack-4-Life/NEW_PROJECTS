<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Waypoint Budget Studio v1.0 — Interactive Budget Dashboard</title>
<meta name="description" content="Offline interactive budget dashboard: safe-to-spend, payday planner, bill calendar, envelope budgets, debt payoff and savings goals. No account, no subscription, works in any browser.">
<style>
/* ==========================================================================
   Waypoint Budget Studio — design system
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0a0e13; --bg-grad:radial-gradient(1200px 700px at 12% -8%,rgba(245,196,81,.10),transparent 60%),
                          radial-gradient(900px 600px at 100% 0%,rgba(125,211,252,.07),transparent 55%);
  --surface:#121a23; --surface-2:#17212c; --surface-3:#1d2836;
  --line:#233040; --line-soft:rgba(255,255,255,.06);
  --grid:rgba(255,255,255,.06); --track:rgba(255,255,255,.09); --tick:rgba(255,255,255,.22);
  --text:#e9f0f8; --muted:#93a6ba; --dim:#6b7f94;
  --accent:#f5c451; --accent-ink:#1a1305; --accent-2:#7dd3fc;
  --good:#4ade80; --warn:#fbbf24; --danger:#f87171;
  --radius:16px; --radius-sm:11px; --radius-lg:22px;
  --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  --shadow-sm:0 6px 18px -10px rgba(0,0,0,.7);
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="daylight"]{
  --bg:#f4f6fa; --bg-grad:radial-gradient(1100px 620px at 10% -10%,rgba(79,70,229,.10),transparent 60%),
                          radial-gradient(900px 560px at 100% 0%,rgba(14,165,233,.10),transparent 55%);
  --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eef2f8;
  --line:#e2e8f0; --line-soft:rgba(15,23,42,.06);
  --grid:rgba(15,23,42,.07); --track:rgba(15,23,42,.09); --tick:rgba(15,23,42,.25);
  --text:#101a2b; --muted:#5a6b81; --dim:#8a99ac;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-2:#0ea5e9;
  --good:#16a34a; --warn:#d97706; --danger:#dc2626;
  --shadow:0 18px 40px -22px rgba(16,26,43,.30);
  --shadow-sm:0 8px 20px -12px rgba(16,26,43,.28);
  color-scheme:light;
}
html[data-theme="vault"]{
  --bg:#06110e; --bg-grad:radial-gradient(1100px 620px at 8% -10%,rgba(52,211,153,.14),transparent 60%),
                          radial-gradient(900px 560px at 100% 0%,rgba(163,230,53,.07),transparent 55%);
  --surface:#0b1a16; --surface-2:#0f231d; --surface-3:#142c25;
  --line:#1d3a31; --grid:rgba(255,255,255,.06); --track:rgba(255,255,255,.09); --tick:rgba(255,255,255,.22);
  --text:#e6f5ef; --muted:#8db3a6; --dim:#5d8176;
  --accent:#34d399; --accent-ink:#04241a; --accent-2:#a3e635;
  --good:#4ade80; --warn:#fbbf24; --danger:#fb7185;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8);
}
html[data-theme="blush"]{
  --bg:#140d12; --bg-grad:radial-gradient(1100px 620px at 10% -10%,rgba(244,114,182,.16),transparent 60%),
                          radial-gradient(900px 560px at 100% 0%,rgba(192,132,252,.10),transparent 55%);
  --surface:#1d1319; --surface-2:#261923; --surface-3:#2f1f2c;
  --line:#3a2634; --grid:rgba(255,255,255,.06); --track:rgba(255,255,255,.1); --tick:rgba(255,255,255,.22);
  --text:#fbeef5; --muted:#c39bb0; --dim:#96738a;
  --accent:#f472b6; --accent-ink:#2a0716; --accent-2:#c084fc;
  --good:#86efac; --warn:#fdba74; --danger:#fb7185;
  --shadow:0 18px 40px -18px rgba(0,0,0,.8);
}
html[data-theme="paper"]{
  --bg:#f6f1e7; --bg-grad:radial-gradient(1100px 620px at 8% -10%,rgba(180,83,9,.10),transparent 60%),
                          radial-gradient(900px 560px at 100% 0%,rgba(20,83,45,.08),transparent 55%);
  --surface:#fffdf8; --surface-2:#f8f3ea; --surface-3:#efe7da;
  --line:#e3d9c8; --grid:rgba(60,42,20,.08); --track:rgba(60,42,20,.10); --tick:rgba(60,42,20,.25);
  --text:#2b2115; --muted:#77664f; --dim:#9b8b74;
  --accent:#b45309; --accent-ink:#fffaf2; --accent-2:#0f766e;
  --good:#15803d; --warn:#b45309; --danger:#b91c1c;
  --shadow:0 18px 40px -22px rgba(43,33,21,.32);
  --shadow-sm:0 8px 20px -12px rgba(43,33,21,.28);
  color-scheme:light;
}
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); background-image:var(--bg-grad); background-attachment:fixed;
  color:var(--text); font-family:var(--font); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent-2)}
::selection{background:var(--accent);color:var(--accent-ink)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.amt{white-space:nowrap}
body.privacy .amt,body.privacy .chart-axis,body.privacy .heat{filter:blur(7px);transition:filter .18s}
body.privacy .amt{cursor:pointer}

/* ------------------------------------------------------------ scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ---------------------------------------------------------------- shell */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
  padding:20px 14px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,transparent);
  backdrop-filter:blur(12px);z-index:40;
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 14px}
.brand .mark{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 45%,var(--accent-2)));
  color:var(--accent-ink);box-shadow:0 6px 16px -8px var(--accent);
}
.brand .mark svg{width:19px;height:19px}
.brand b{font-size:15.5px;letter-spacing:-.02em;display:block;line-height:1.15}
.brand small{color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-sm);
  color:var(--muted);font-weight:550;font-size:14px;transition:.14s;position:relative;width:100%;text-align:left
}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.on{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.nav-item.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav-item .ico{width:18px;height:18px;flex:0 0 auto;opacity:.9}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--danger);color:#fff}
.nav-item .badge.soft{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.payday-card{
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;
  background:linear-gradient(160deg,var(--surface-2),color-mix(in srgb,var(--surface) 80%,transparent));
}
.payday-card .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
.payday-card .big{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.payday-card .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.payday-card .count{
  display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11.5px;font-weight:600;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:3px 9px;border-radius:20px
}
.side-actions{display:flex;gap:6px}
.side-actions button{flex:1;display:grid;place-items:center;height:34px;border-radius:10px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2);transition:.14s}
.side-actions button:hover{color:var(--text);border-color:var(--muted)}
.side-actions button.on{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.side-actions svg{width:16px;height:16px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:12px;
  padding:14px 26px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px) saturate(1.3);
}
.topbar .titles{min-width:0}
.topbar h1{font-size:19px;letter-spacing:-.02em}
.topbar .crumb{font-size:12px;color:var(--dim);margin-top:1px}
.qa{
  margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 1 460px;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:0 6px 0 12px;height:44px;
  transition:.15s;
}
.qa:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
.qa svg{width:17px;height:17px;color:var(--dim);flex:0 0 auto}
.qa input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;font-size:14px}
.qa input::placeholder{color:var(--dim)}
.qa kbd{
  font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line);
  border-radius:6px;padding:2px 6px;background:var(--surface-2)
}
.top-actions{display:flex;gap:8px;align-items:center}

.view{padding:22px 26px 90px;max-width:1560px;width:100%;margin:0 auto;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabbar{display:none}

/* ------------------------------------------------------------- primitives */
.card{
  background:linear-gradient(168deg,var(--surface),color-mix(in srgb,var(--surface-2) 55%,var(--surface)));
  border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);
  position:relative;min-width:0;
}
.card.pad-sm{padding:14px}
.card h2,.card h3{font-size:14px;letter-spacing:-.01em}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head .t{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.card-head .s{font-size:11.5px;color:var(--dim)}
.card-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:16px}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-32{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-23{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.dim{color:var(--dim)}
.tiny{font-size:11.5px}
.small{font-size:12.5px}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.good{color:var(--good)} .warn{color:var(--warn)} .danger{color:var(--danger)} .accent{color:var(--accent)}
.center{text-align:center}
.hidden{display:none !important}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;
  border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);
  font-weight:600;font-size:13.5px;transition:.14s;white-space:nowrap
}
.btn:hover{border-color:var(--muted);transform:translateY(-1px)}
.btn:active{transform:none}
.btn svg{width:16px;height:16px}
.btn.sm{height:31px;padding:0 11px;font-size:12.5px;border-radius:9px}
.btn.xs{height:26px;padding:0 9px;font-size:11.5px;border-radius:8px;gap:5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -14px var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 14%,transparent)}
.btn.link{border:0;background:none;color:var(--accent-2);height:auto;padding:0}
.btn.icon{width:36px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;
  background:var(--surface-3);color:var(--muted);border:1px solid var(--line-soft);white-space:nowrap
}
.chip.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent);border-color:transparent}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:transparent}
.chip.danger{color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent);border-color:transparent}
.chip.accent{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:transparent}
.chip.ghost{background:transparent}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill-group{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.pill-group button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);transition:.14s}
.pill-group button.on{background:var(--surface-3);color:var(--text);box-shadow:var(--shadow-sm)}
.pill-group button:hover:not(.on){color:var(--text)}

input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;height:40px;padding:0 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface-2);outline:0;transition:.14s;font-size:14px
}
textarea{height:auto;padding:10px 12px;resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 11%,transparent)}
label.field{display:block}
label.field .lb{display:block;font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:20px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:20px;background:var(--track)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .slider{width:42px;height:24px;border-radius:20px;background:var(--track);transition:.18s;position:relative;flex:0 0 auto}
.switch .slider::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.18s}
.switch input:checked + .slider{background:color-mix(in srgb,var(--accent) 34%,transparent)}
.switch input:checked + .slider::after{transform:translateX(18px);background:var(--accent)}
.switch .txt{font-size:13px;font-weight:550}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.check input{width:17px;height:17px;accent-color:var(--accent)}

.bar-track{height:9px;border-radius:20px;background:var(--track);overflow:hidden;position:relative}
.bar-track.thin{height:6px}
.bar-fill{display:block;height:100%;border-radius:20px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar-fill.over{background:var(--danger) !important}
.bar-fill.good{background:var(--good)}

table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);text-align:left;font-weight:700;padding:0 10px 9px 0;white-space:nowrap}
td{padding:9px 10px 9px 0;border-top:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
td.r,th.r{text-align:right;padding-right:0}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line-soft);transition:.12s;border-radius:9px}
.li:first-child{border-top:0}
.li:hover{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.li .ic{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;
  background:var(--surface-3);border:1px solid var(--line-soft)
}
.li .tx{min-width:0;flex:1}
.li .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{font-size:11.5px;color:var(--dim)}
.li .va{font-weight:650;font-variant-numeric:tabular-nums;font-size:13.5px}
.li .acts{display:flex;gap:4px;opacity:0;transition:.14s}
.li:hover .acts,.li:focus-within .acts{opacity:1}
.li.dim-row{opacity:.5}
.day-sep{display:flex;align-items:center;gap:10px;padding:12px 0 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:700}
.day-sep::after{content:"";flex:1;height:1px;background:var(--line-soft)}

.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:30px 18px;color:var(--dim)}
.empty .em{font-size:30px;opacity:.7}
.empty b{color:var(--muted);font-size:14px}

/* ------------------------------------------------------------- dashboard */
.hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px}
.safe-card{
  background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),var(--surface) 62%);
  border:1px solid color-mix(in srgb,var(--accent) 26%,var(--line));
  overflow:hidden;
}
.safe-card::after{
  content:"";position:absolute;right:-90px;top:-90px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 68%);pointer-events:none
}
.safe-main{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.safe-num{font-size:clamp(38px,5.4vw,60px);font-weight:750;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.safe-sub{font-size:13px;color:var(--muted);margin-top:8px;max-width:44ch}
.safe-perday{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.ledger{border-top:1px dashed var(--line);margin-top:16px;padding-top:12px;display:none}
.ledger.open{display:block;animation:fade .2s}
.ledger-row{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:13px}
.ledger-row b{font-variant-numeric:tabular-nums;font-weight:600}
.ledger-row.total{border-top:1px solid var(--line);margin-top:7px;padding-top:9px;font-weight:700}
.ledger-row .lbl{color:var(--muted)}
.ledger-foot{font-size:11.5px;color:var(--dim);margin-top:9px;line-height:1.45}

.metric{padding:15px 16px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line-soft)}
.metric .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700}
.metric .v{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.metric .d{font-size:11.5px;color:var(--muted);margin-top:3px}

.alert{
  display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;font-size:13px;
  background:var(--surface-2);border:1px solid var(--line);border-left-width:3px

var _saveTimer = null, _quotaWarned = false;

function load() {
  var raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
  if (!raw) { DB = blankDB(); return { fresh: true }; }
  try {
    var parsed = JSON.parse(raw);
    DB = migrate(parsed);
    return { fresh: false };
  } catch (e) {
    try { localStorage.setItem(BACKUP_KEY, raw); } catch (e2) { }

function migrate(db) {
  var base = blankDB();
  /* shallow-merge unknown keys forward so upgrades never wipe data */
  var out = {};
  for (var k in base) if (base.hasOwnProperty(k)) out[k] = base[k];
  for (var k2 in db) if (db.hasOwnProperty(k2)) out[k2] = db[k2];
  var s = {}; for (var k3 in base.settings) s[k3] = base.settings[k3];
  for (var k4 in (db.settings || {})) s[k4] = db.settings[k4];
  out.settings = s;
  out.cats = (db.cats && db.cats.length) ? db.cats : defaultCategories();
  out.tx = db.tx || []; out.bills = db.bills || []; out.income = db.income || [];
  out.debts = db.debts || []; out.goals = db.goals || []; out.accounts = db.accounts || base.accounts;
  out.paid = db.paid || {}; out.snaps = db.snaps || [];
  out.done = db.done || { welcome: false, tour: false };
  out.v = 1;
  return out;
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* --------------------------------------------------------------- accounts */

  return false;
}
function txIndex() {
  if (_idx && _idx.stamp === DB.updatedAt) return _idx;
  var ix = { stamp: DB.updatedAt, month: {}, day: {} };
  DB.tx.forEach(function (t) {
    var d = parseYMD(t.date);
    var mk = monthKey(d), dk = ymd(d);
    var m = ix.month[mk] || (ix.month[mk] = { cat: {}, income: 0, expense: 0, count: 0 });
    var rec = ix.day[dk] || (ix.day[dk] = { spend: 0, income: 0, count: 0, cat: {}, scheduled: 0 });
    var amt = Math.abs(Number(t.amount) || 0);
    m.count++; rec.count++;
    if (t.amount >= 0) { m.income += amt; rec.income += amt; }
    else {
      m.expense += amt; rec.spend += amt;
      m.cat[t.catId] = (m.cat[t.catId] || 0) + amt;
      rec.cat[t.catId] = (rec.cat[t.catId] || 0) + amt;
      if (isScheduled(t)) rec.scheduled += amt;          /* bills + goal deposits */
    }
  });
  _idx = ix;
  return ix;
}
function isWholeMonth(from, to) {
  return from.getDate() === 1 &&
    to.getMonth() === from.getMonth() && to.getFullYear() === from.getFullYear() &&
    to.getDate() === daysInMonth(from.getFullYear(), from.getMonth());
}

/* --------------------------------------------------------- average spend */
function dailyDiscretionary(days) {
  var n = days || 45;
  var to = today(), from = addDays(to, -n);
  var ix = txIndex();
  var tot = 0;
  for (var i = 0; i <= n; i++) {
    var d = addDays(from, i);
    var rec = ix.day[ymd(d)];
    if (!rec) continue;
    /* strips out bills and goal deposits: those are already scheduled elsewhere */
    tot += Math.max(0, rec.spend - rec.scheduled);
  }
  if (tot <= 0) {
    var cap = sum(DB.cats.filter(function (c) { return c.cap > 0; }), function (c) { return c.cap; });
    var dim = daysInMonth(to.getFullYear(), to.getMonth());
    return cap ? cap / dim : 0;
  }
  return tot / Math.max(14, n);
}

/* --------------------------------------------------------- safe to spend */
function safeToSpend() {
  var s = DB.settings;
  var t = today();
  var pay = nextPayday(t);
  var scopeEnd, mode = s.safeMode;
  if (mode === 'restOfMonth') scopeEnd = endOfMonth(t);
  else if (mode === 'next30') scopeEnd = addDays(t, 30);
  else scopeEnd = pay;
  if (scopeEnd < t) scopeEnd = t;

  var cash = accountCash();
  var bills = billOccurrences(t, scopeEnd).filter(function (o) { return !o.paid; });
  var billTotal = sum(bills, function (o) { return o.amount; });

  /* debt minimums falling inside the scope */
  var dm = 0, debtHits = [];
  DB.debts.forEach(function (d) {
    if (!(d.minPayment > 0)) return;
    var due = Number(d.dueDay) || 1;
    var cursor = startOfMonth(t); var guard = 0;
    while (cursor <= scopeEnd && guard++ < 6) {
      var last = daysInMonth(cursor.getFullYear(), cursor.getMonth());
      var dt = new Date(cursor.getFullYear(), cursor.getMonth(), Math.min(due, last));
      if (dt >= t && dt <= scopeEnd) { dm += d.minPayment; debtHits.push({ debt: d, date: dt, amount: d.minPayment }); }
      cursor = addMonths(cursor, 1);
    }
  });

  /* goal contributions due before the next payday */
  var goalReserve = 0;
  if (s.goalReserveInSafe) {
    var spanDays = Math.max(1, diffDays(t, scopeEnd) + 1);
    var perDay = sum(DB.goals, function (g) { return (Number(g.monthly) || 0) * 12 / 365; });
    goalReserve = r2(perDay * spanDays);
  }

  /* realistic mode: also hold back expected everyday spending */
  var paceReserve = 0;
  if (s.spendPaceInSafe) {
    var span = Math.max(1, diffDays(t, scopeEnd) + 1);
    paceReserve = r2(dailyDiscretionary() * span);
  }

  var buffer = Number(s.safetyBuffer) || 0;
  var safe = cash - billTotal - dm - goalReserve - paceReserve - buffer;
  var daysLeft = Math.max(1, diffDays(t, pay));

  return {
    safe: r2(safe),
    perDay: r2(safe / daysLeft),
    cash: r2(cash),
    bills: r2(billTotal),
    billCount: bills.length,
    debtMin: r2(dm),
    goalReserve: r2(goalReserve),
    paceReserve: r2(paceReserve),
    buffer: r2(buffer),
    scopeEnd: scopeEnd,
    payday: pay,
    daysLeft: daysLeft,
    billsList: bills,
    debtList: debtHits.sort(function (a, b) { return a.date - b.date; })
  };
}

/* ------------------------------------------------------------- forecasting */
function forecast(days) {
  var n = days || 60;
  var t = today();
  var s = DB.settings;
  var start = spendableCash();
  var end = addDays(t, n);
  var bills = billOccurrences(t, end).filter(function (o) { return !o.paid || o.date >= t; });
  var inc = incomeOccurrences(t, end);
  var pace = dailyDiscretionary();
  var dm = [];
  DB.debts.forEach(function (d) {
    if (!(d.minPayment > 0)) return;
    var due = Number(d.dueDay) || 1;
    var cursor = startOfMonth(t); var guard = 0;
    while (cursor <= end && guard++ < 8) {
      var last = daysInMonth(cursor.getFullYear(), cursor.getMonth());
      var dt = new Date(cursor.getFullYear(), cursor.getMonth(), Math.min(due, last));
      if (dt >= t && dt <= end) dm.push({ date: dt, amount: d.minPayment, name: d.name + ' payment', kind: 'debt' });
      cursor = addMonths(cursor, 1);
    }
  });

  var events = {};
  function push(d, ev) {
    var k = ymd(d);
    if (!events[k]) events[k] = [];
    events[k].push(ev);
  }
  bills.forEach(function (o) { push(o.date, { kind: 'bill', name: o.bill.name, amount: -o.amount, icon: o.bill.icon, catId: o.bill.catId }); });
  inc.forEach(function (o) { push(o.date, { kind: 'income', name: o.item.name, amount: o.amount, icon: '\uD83D\uDCB0' }); });
  dm.forEach(function (o) { push(o.date, { kind: 'debt', name: o.name, amount: -o.amount, icon: '\uD83C\uDFE6' }); });

  var out = [], bal = start, low = start, lowDate = t;
  for (var i = 0; i <= n; i++) {
    var d = addDays(t, i);
    var list = events[ymd(d)] || [];
    var delta = 0;
    list.forEach(function (e) { delta += e.amount; });
    if (i > 0) { delta -= pace; bal += delta; }
    if (bal < low) { low = bal; lowDate = d; }
    out.push({ date: d, balance: r2(bal), delta: r2(i > 0 ? delta : 0), events: list, pace: r2(pace) });
  }
  var risk = out.filter(function (p) { return p.balance < (Number(s.safetyBuffer) || 0); });
  return {
    points: out, start: r2(start), end: out[out.length - 1].balance,
    low: r2(low), lowDate: lowDate, pace: r2(pace),
    riskDays: risk.length, firstRisk: risk.length ? risk[0] : null, days: n
  };
}

/* -------------------------------------------------------------- envelopes */
function envelopeWindow() {
  var t = today();
  var s = DB.settings;
  /* envelopes run on the calendar month (simplest mental model) */
  return { from: startOfMonth(t), to: endOfMonth(t), key: monthKey(t) };
}
/* one source of truth for "what is budgeted this month" so the dashboard,
   the spend screen and the envelope cards can never disagree */
function envelopeTotals() {
  var env = envelopes();
  var caps = r2(sum(env, function (e) { return e.cap; }));
  var effective = r2(sum(env, function (e) { return e.effectiveCap; }));
  var rollover = r2(sum(env, function (e) { return e.rollover; }));
  var spent = r2(sum(env, function (e) { return e.spent; }));
  return {
    env: env, caps: caps, effective: effective, rollover: rollover, spent: spent,
    left: r2(effective - spent),
    flexibleLeft: r2(sum(env, function (e) { return e.cap > 0 ? Math.max(0, e.left) : 0; })),
    capped: env.filter(function (e) { return e.cap > 0; }).length
  };
}

function catSpend(from, to) {
  if (isWholeMonth(from, to)) {
    var m = txIndex().month[monthKey(from)];
    return m ? m.cat : {};
  }
  var map = {};
  DB.tx.forEach(function (x) {
    if (x.amount >= 0) return;
    var d = parseYMD(x.date);
    if (d < from || d > to) return;
    map[x.catId] = (map[x.catId] || 0) + Math.abs(x.amount);
  });
  return map;
}
function billedByCat(from, to) {
  var map = {};
  billOccurrences(from, to).forEach(function (o) {
    map[o.bill.catId] = (map[o.bill.catId] || 0) + o.amount;
  });
  return map;
}
function envelopes() {
  var w = envelopeWindow();
  var spent = catSpend(w.from, w.to);
  var billed = billedByCat(w.from, w.to);
  var dayOf = today().getDate();
  var dim = daysInMonth(today().getFullYear(), today().getMonth());
  var elapsed = clamp(dayOf / dim, 0, 1);
  var carryOn = !!DB.settings.rollover;
  return DB.cats.map(function (c) {
    var s = r2(spent[c.id] || 0);
    var cap = Number(c.cap) || 0;
    var roll = 0;
    if (carryOn && c.rollover && cap > 0) {
      /* look back up to 3 closed months, newest first, and bank what was unused */
      for (var back = 1; back <= 3; back++) {
        var m = addMonths(today(), -back);
        var f = startOfMonth(m), t2 = endOfMonth(m);
        var past = catSpend(f, t2)[c.id] || 0;
        var leftover = cap - past;
        if (leftover <= 0) break;
        roll += leftover;
        cap = Number(c.cap) || 0; /* base cap stays the cap; rollover is additive */
      }
    }
    var effective = cap + roll;
    /* what should have left this envelope by today: the fixed bills for the
       month plus a straight-line share of whatever is left of the cap */
    var sched = r2(billed[c.id] || 0);
    var flexible = Math.max(0, effective - sched);
    var expected = r2(sched + flexible * elapsed);
    var delta = r2(s - expected);
    var tol = Math.max(15, effective * 0.12);
    return {
      cat: c, spent: s, cap: cap, rollover: r2(roll), effectiveCap: r2(effective), left: r2(effective - s),
      pct: effective > 0 ? clamp((s / effective) * 100, 0, 999) : 0,
      over: effective > 0 && s > effective,
      scheduled: sched, flexible: r2(flexible), expected: expected, paceDelta: delta,
      mostlyBills: effective > 0 && sched >= effective * 0.6,
      hot: effective > 0 && delta > tol && s <= effective,
      ahead: effective > 0 && delta < -tol
    };
  });
}

function monthSummary(key) {
  var d = parseMonthKey(key || monthKey(today()));
  var from = startOfMonth(d), to = endOfMonth(d);
  var rec = txIndex().month[monthKey(d)] || { cat: {}, income: 0, expense: 0, count: 0 };
  var income = rec.income, expense = rec.expense, byCat = rec.cat, count = rec.count;
  var expected = sum(incomeOccurrences(today() > to ? addDays(to, 1) : today(), to), function (o) { return o.amount; });
  return { key: monthKey(d), from: from, to: to, income: r2(income), expense: r2(expense), net: r2(income - expense), byCat: byCat, count: count, expectedMore: r2(expected) };
}

function paceForCurrentMonth() {
  var t = today();
  var key = monthKey(t);
  var sum0 = monthSummary(key);
  var dim = daysInMonth(t.getFullYear(), t.getMonth());
  var dayOf = t.getDate();
  var daysLeft = Math.max(0, dim - dayOf);
  var from = addDays(t, 1), to = endOfMonth(t);

  /* what is still scheduled to leave before the month ends */
  var upcomingBills = billOccurrences(from, to).filter(function (o) { return !o.paid; });
  var billsLeft = sum(upcomingBills, function (o) { return o.amount; });
  var debtLeft = 0;
  DB.debts.forEach(function (d) {
    if (!(d.minPayment > 0)) return;
    var due = Number(d.dueDay) || 1;
    var dt = new Date(t.getFullYear(), t.getMonth(), Math.min(due, dim));
    if (dt >= from && dt <= to) debtLeft += d.minPayment;
  });

  var pace = dailyDiscretionary();
  var everydayLeft = r2(pace * daysLeft);
  var projected = r2(sum0.expense + billsLeft + debtLeft + everydayLeft);
  var totals = envelopeTotals();
  var caps = totals.effective;                     /* includes money carried over */
  var leftInEnvelopes = r2(sum(envelopes(), function (e) { return e.cap > 0 ? e.left : 0; }));

  return {
    month: sum0, daily: r2(pace), projected: projected, daysLeft: daysLeft,
    dayOf: dayOf, daysIn: dim, caps: caps, capsBase: totals.caps, rollover: totals.rollover,
    scheduledLeft: r2(billsLeft + debtLeft), billsLeft: r2(billsLeft), debtLeft: r2(debtLeft),
    everydayLeft: everydayLeft, everydayAverage: r2(pace),
    remainingEnvelope: leftInEnvelopes,
    safeDaily: daysLeft > 0 ? r2(Math.max(0, leftInEnvelopes) / daysLeft) : 0,

}

/* ---------------------------------------------------------------- goals */
function goalInfo(g) {
  var target = Number(g.target) || 0, saved = Number(g.saved) || 0;
  var pctDone = target > 0 ? clamp((saved / target) * 100, 0, 100) : 0;
  var monthly = Number(g.monthly) || 0;
  var remaining = Math.max(0, target - saved);
  var monthsLeft = monthly > 0 ? Math.ceil(remaining / monthly) : Infinity;
  var eta = isFinite(monthsLeft) ? addMonths(today(), monthsLeft) : null;
  var targetDate = g.date ? parseYMD(g.date) : null;
  var monthsToTarget = targetDate ? Math.max(1, Math.round(diffDays(today(), targetDate) / 30.44)) : null;
  var needed = monthsToTarget ? r2(remaining / monthsToTarget) : 0;
  return {
    goal: g, target: target, saved: saved, pct: pctDone, remaining: r2(remaining),
    monthly: monthly, monthsLeft: monthsLeft, eta: eta, targetDate: targetDate,
    needed: needed, onTrack: targetDate ? (eta && eta <= targetDate) : null,
    complete: remaining <= 0.005

}

/* ---------------------------------------------------------------- debts */
function debtPlan(strategy, extraPerMonth, targetId) {
  var strat = strategy || 'snowball';
  var extra = Number(extraPerMonth) || 0;
  var debts = DB.debts.filter(function (d) { return (Number(d.balance) || 0) > 0.005; })
    .map(function (d) {
      return {
        id: d.id, name: d.name, bal: Number(d.balance) || 0, apr: Number(d.apr) || 0,
        min: Math.max(0, Number(d.minPayment) || 0), icon: d.icon
      };
    });
  if (!debts.length) return { months: 0, empty: true, order: [], schedule: [], totalInterest: 0, totalPaid: 0, payoffDate: today() };

  var totalMin = sum(debts, function (d) { return d.min; });
  var budget = Math.max(totalMin, totalMin + extra);
  var months = 0, totalInterest = 0, totalPaid = 0;
  var schedule = [], order = [], guard = 0;

  /* remember starting balances so minimum-only baseline can reuse them */
  while (guard++ < 900) {
    var active = debts.filter(function (d) { return d.bal > 0.005; });
    if (!active.length) break;
    months++;
    var mKey = monthKey(addMonths(today(), months));
    /* interest */
    active.forEach(function (d) {
      var int = d.bal * (d.apr / 100 / 12);
      d.bal += int; totalInterest += int;
    });
    /* minimum payments */
    var pot = budget;
    active.forEach(function (d) {
      if (d.bal <= 0.005) return;
      var pay = Math.min(d.bal, d.min, pot);
      d.bal -= pay; pot -= pay; totalPaid += pay;
    });
    /* can a freed-up payment cascade? yes — pot already holds leftover */
    var guard2 = 0;
    while (pot > 0.005 && guard2++ < 60) {
      var list = debts.filter(function (d) { return d.bal > 0.005; });
      if (!list.length) break;
      var pick = null;   /* must be reset every pass: var is function-scoped */
      if (targetId) { pick = byId(list, targetId) || null; }
      if (!pick) {
        if (strat === 'avalanche') { pick = sortBy(list, function (d) { return d.apr; }, 'desc')[0]; }
        else if (strat === 'custom' && targetId) { pick = byId(list, targetId); }
        else { pick = sortBy(list, function (d) { return d.bal; })[0]; }
      }
      if (!pick) break;
      var p2 = Math.min(pick.bal, pot);
      pick.bal -= p2; pot -= p2; totalPaid += p2;
    }
    /* record payoffs */
    debts.forEach(function (d) {
      if (d.bal <= 0.005 && !d._done) { d._done = true; order.push({ name: d.name, id: d.id, month: months, date: addMonths(today(), months) }); }
    });
    schedule.push({
      month: months, key: mKey, remaining: r2(sum(debts, function (d) { return Math.max(0, d.bal); })),
      paid: r2(totalPaid), interest: r2(totalInterest)
    });
    if (months > 720) break;
  }
  return {
    months: months, order: order, schedule: schedule,
    totalInterest: r2(totalInterest), totalPaid: r2(totalPaid),
    payoffDate: addMonths(today(), months), budget: r2(budget),
    totalMin: r2(totalMin), extra: extra, strategy: strat,
    balances: debts.map(function (d) { return { id: d.id, name: d.name, start: byId(DB.debts, d.id).balance, apr: d.apr, min: d.min, icon: d.icon }; })
  };
}

function debtSummary() {
  var total = sum(DB.debts, function (d) { return Number(d.balance) || 0; });
  var minPay = sum(DB.debts, function (d) { return Number(d.minPayment) || 0; });
  var wApr = total > 0 ? sum(DB.debts, function (d) { return (Number(d.apr) || 0) * (Number(d.balance) || 0); }) / total : 0;
  var minOnly = debtPlan('avalanche', 0);
  return { total: r2(total), minPay: r2(minPay), avgApr: r2(wApr), count: DB.debts.length, minOnly: minOnly };
}

/* -------------------------------------------------- subscription detection */
function normalize(name) {
  return String(name || '').toLowerCase()
    .replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function detectSubscriptions() {
  var groups = {};
  var from = addDays(today(), -200);
  DB.tx.forEach(function (x) {
    if (x.type !== 'expense' || x.amount >= 0) return;
    var d = parseYMD(x.date);
    if (d < from) return;
    var key = normalize(x.note);
    if (key.length < 3) return;
    if (!groups[key]) groups[key] = { name: x.note, catId: x.catId, dates: [], amounts: [] };
    groups[key].dates.push(d);
    groups[key].amounts.push(Math.abs(x.amount));
  });
  var out = [];
  Object.keys(groups).forEach(function (k) {
    var g = groups[k];
    if (g.dates.length < 2) return;
    g.dates.sort(function (a, b) { return a - b; });
    var gaps = [];
    for (var i = 1; i < g.dates.length; i++) gaps.push(diffDays(g.dates[i - 1], g.dates[i]));
    var avgGap = sum(gaps) / gaps.length;
    var amts = g.amounts;
    var avgAmt = sum(amts) / amts.length;
    var amtSpread = avgAmt ? (Math.max.apply(null, amts) - Math.min.apply(null, amts)) / avgAmt : 1;
    var cadence = null, perMonth = 0;
    var tol = Math.max(3, avgGap * 0.25);
    var gapSpread = Math.max.apply(null, gaps) - Math.min.apply(null, gaps);
    var steady = gapSpread <= Math.max(4, tol);
    var enoughEvidence = false;
    if (amts.length >= 4 && avgGap <= 20) enoughEvidence = true;          /* weekly / fortnightly */
    else if (amts.length >= 3 && avgGap <= 45) enoughEvidence = true;     /* monthly */
    else if (amts.length >= 2 && avgGap > 45) enoughEvidence = true;      /* quarterly / annual */
    if (enoughEvidence && amtSpread < 0.05 && steady) {
      if (Math.abs(avgGap - 7) <= 3) { cadence = 'weekly'; perMonth = 52 / 12; }
      else if (Math.abs(avgGap - 14) <= 4) { cadence = 'biweekly'; perMonth = 26 / 12; }
      else if (Math.abs(avgGap - 30) <= 8) { cadence = 'monthly'; perMonth = 1; }
      else if (Math.abs(avgGap - 91) <= 20) { cadence = 'quarterly'; perMonth = 1 / 3; }
      else if (Math.abs(avgGap - 365) <= 45) { cadence = 'annual'; perMonth = 1 / 12; }
    }
    if (!cadence) return;
    var already = DB.bills.some(function (b) {
      return normalize(b.name).indexOf(k.split(' ')[0]) === 0 || k.indexOf(normalize(b.name).split(' ')[0]) === 0;
    });
    out.push({
      name: g.name, key: k, cadence: cadence, avg: r2(avgAmt),
      monthly: r2(avgAmt * perMonth), last: g.dates[g.dates.length - 1],
      count: g.dates.length, catId: g.catId, alreadyTracked: already
    });
  });
  return out.sort(function (a, b) {
    if (a.alreadyTracked !== b.alreadyTracked) return a.alreadyTracked ? 1 : -1;
    return b.monthly - a.monthly;
  });
}

/* ------------------------------------------------------------- money score */
function moneyScore() {
  var parts = [];
  var s = DB.settings;

  /* 1. Savings rate over the trailing 3 months */
  var months = [];
  for (var i = 0; i < 3; i++) months.push(monthSummary(monthKey(addMonths(today(), -i))));
  var inc = sum(months, function (m) { return m.income; });
  var exp = sum(months, function (m) { return m.expense; });
  var rate = inc > 0 ? (inc - exp) / inc : 0;
  parts.push({
    key: 'Savings rate', value: clamp((rate / 0.2) * 100, 0, 100),
    detail: inc > 0 ? Math.round(rate * 100) + '% of income kept (target 20%)' : 'Log income to unlock',
    weight: 30
  });

  /* 2. Envelope discipline this month */
  var env = envelopes().filter(function (e) { return e.cap > 0; });
  var okCount = env.filter(function (e) { return !e.over; }).length;
  parts.push({
    key: 'Envelope discipline', value: env.length ? (okCount / env.length) * 100 : 60,
    detail: env.length ? okCount + ' of ' + env.length + ' envelopes inside their cap' : 'Set envelope caps to unlock',
    weight: 20
  });

  /* 3. Bill coverage — can cash cover bills before the next payday? */
  var sts = safeToSpend();
  var cov = sts.cash > 0 ? clamp((sts.cash - sts.bills) / Math.max(1, sts.bills) * 100, 0, 100) : 0;
  parts.push({
    key: 'Bill coverage', value: cov,
    detail: sts.bills > 0 ? 'Bills due before payday: ' + money0(sts.bills) : 'No bills due before payday',
    weight: 20
  });

  /* 4. Emergency runway (months of expenses covered by savings) */
  var avgExp = 0;
  var mm = months.filter(function (m) { return m.expense > 0; });
  if (mm.length) avgExp = sum(mm, function (m) { return m.expense; }) / mm.length;
  var savings = sum(DB.accounts.filter(function (a) { return a.kind === 'savings'; }), function (a) { return Math.max(0, Number(a.balance) || 0); });
  var runway = avgExp > 0 ? savings / avgExp : 0;
  parts.push({
    key: 'Emergency runway', value: clamp((runway / 6) * 100, 0, 100),
    detail: (avgExp > 0 ? runway.toFixed(1) : '0') + ' months covered (target 6)',
    weight: 20
  });

  /* 5. Debt pressure — minimums as a share of income */
  var ds = debtSummary();
  var monthlyIncome = inc > 0 ? inc / 3 : 0;
  var ratio = monthlyIncome > 0 ? ds.minPay / monthlyIncome : (ds.minPay > 0 ? 1 : 0);
  parts.push({
    key: 'Debt pressure', value: clamp((1 - ratio / 0.35) * 100, 0, 100),
    detail: monthlyIncome > 0 ? 'Debt payments are ' + Math.round(ratio * 100) + '% of income (keep under 35%)' : (ds.count ? 'Log income to unlock' : 'No debts tracked — nice'),
    weight: 10
  });

  var score = 0;
  parts.forEach(function (p) { score += (p.value / 100) * p.weight; });
  score = Math.round(score);
  var grade = score >= 90 ? 'Excellent' : score >= 75 ? 'Strong' : score >= 60 ? 'Steady' : score >= 40 ? 'Building' : 'Starting out';
  return { score: score, grade: grade, parts: parts };
}

/* -------------------------------------------------------------- quick add
   Parses "12.50 coffee #dining @card yesterday" into a transaction draft. */
function parseQuickAdd(text) {
  var raw = String(text || '').trim();
  var out = { amount: null, note: '', catId: null, accountId: null, date: ymd(today()), type: 'expense' };
  if (!raw) return out;
  var m = raw.match(/(?:^|\s)(-?)([$£€¥]?)(\d+(?:[.,]\d{1,2})?)(?:\s|$)/);
  if (m) {
    var amt = parseFloat(m[3].replace(',', '.'));
    if (!isNaN(amt)) {
      out.amount = Math.abs(amt);
      out.type = m[1] === '-' ? 'expense' : (m[2] && m[2] !== '$' ? 'expense' : 'expense');
      raw = raw.replace(m[0], ' ');
    }
  }
  var cat = raw.match(/#([a-z0-9_\-]+)/i);
  if (cat) {
    var key = cat[1].toLowerCase();
    var found = DB.cats.filter(function (c) {
      return c.id.toLowerCase() === key || normalize(c.name).indexOf(key) === 0 || normalize(c.name).split(' ')[0] === key;
    })[0];
    if (found) out.catId = found.id;
    raw = raw.replace(cat[0], ' ');
  }
  var acct = raw.match(/@([a-z0-9_\-]+)/i);
  if (acct) {
    var key2 = acct[1].toLowerCase();
    var fa = DB.accounts.filter(function (a) {
      return a.id.toLowerCase() === key2 || normalize(a.name).indexOf(key2) === 0;
    })[0];
    if (fa) out.accountId = fa.id;
    raw = raw.replace(acct[0], ' ');
  }
  if (/\btoday\b/i.test(raw)) out.date = ymd(today());
  else if (/\byesterday\b/i.test(raw)) out.date = ymd(addDays(today(), -1));
  else if (/\b(\d{1,2})\/(\d{1,2})\b/.test(raw)) {
    var dm2 = raw.match(/\b(\d{1,2})\/(\d{1,2})\b/);
    var mm2 = parseInt(dm2[1], 10), dd2 = parseInt(dm2[2], 10);
    var yy = today().getFullYear();
    if (mm2 >= 1 && mm2 <= 12 && dd2 >= 1 && dd2 <= 31) {
      var cand = new Date(yy, mm2 - 1, dd2);
      if (cand > addDays(today(), 1)) cand = new Date(yy - 1, mm2 - 1, dd2);
      out.date = ymd(cand);
      raw = raw.replace(dm2[0], ' ');
    }
  }
  if (/\bincome\b|\bpaycheck\b|\bsalary\b/i.test(raw)) out.type = 'income';
  else if (/\brefund\b|\bcashback\b/i.test(raw)) out.type = 'income';
  out.note = raw.replace(/\s+/g, ' ').trim();
  return out;
}

/* ------------------------------------------------------------ breakdowns */
function upcoming(limit, days) {
  var t = today(), end = addDays(t, days || 30);
  var list = [];
  billOccurrences(t, end).forEach(function (o) {
    list.push({ kind: 'bill', date: o.date, name: o.bill.name, amount: -o.amount, icon: o.bill.icon, catId: o.bill.catId, paid: o.paid, id: o.bill.id, autopay: o.bill.autopay });
  });
  incomeOccurrences(t, end).forEach(function (o) {
    list.push({ kind: 'income', date: o.date, name: o.item.name, amount: o.amount, icon: '\uD83D\uDCB0', catId: 'income', paid: o.date < t });
  });
  DB.debts.forEach(function (d) {
    if (!(d.minPayment > 0)) return;
    var due = Number(d.dueDay) || 1;
    var cursor = startOfMonth(t); var guard = 0;
    while (cursor <= end && guard++ < 4) {
      var last = daysInMonth(cursor.getFullYear(), cursor.getMonth());
      var dt = new Date(cursor.getFullYear(), cursor.getMonth(), Math.min(due, last));
      if (dt >= t && dt <= end) { list.push({ kind: 'debt', date: dt, name: d.name + ' \u2014 minimum', amount: -d.minPayment, icon: d.icon || '\uD83C\uDFE6', catId: 'debt' }); }
      cursor = addMonths(cursor, 1);
    }
  });
  var sorted = sortBy(list, function (x) { return x.date.getTime(); });
  return limit ? sorted.slice(0, limit) : sorted;
}

function monthlyTrend(n) {
  var out = [];
  for (var i = n - 1; i >= 0; i--) {
    var m = addMonths(today(), -i);
    var s = monthSummary(monthKey(m));
    out.push({ key: s.key, label: MONTHS[m.getMonth()].slice(0, 3), income: s.income, expense: s.expense, net: s.net, from: s.from });
  }
  return out;
}

function netWorthSeries() {
  var snaps = DB.snaps.slice();
  snaps.push({ date: ymd(today()), netWorth: netWorth() });
  return sortBy(snaps, function (s) { return s.date; });
}

function streaks() {
  /* consecutive days with at least one transaction logged (engagement, not guilt) */
  var days = {};
  DB.tx.forEach(function (x) { days[x.date] = 1; });
  var n = 0, d = today();
  if (!days[ymd(d)]) d = addDays(d, -1);
  var guard = 0;
  while (days[ymd(d)] && guard++ < 400) { n++; d = addDays(d, -1); }
  return n;
}

};
function svgIcon(name, size) {
  return '<svg viewBox="0 0 24 24" width="' + (size || 18) + '" height="' + (size || 18) +
    '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    (ICON[name] || '') + '</svg>';
}

var THEMES = [
  { id: 'midnight', label: 'Midnight', swatch: '#f5c451' },
  { id: 'vault', label: 'Vault', swatch: '#34d399' },
  { id: 'blush', label: 'Blush', swatch: '#f472b6' },
  { id: 'daylight', label: 'Daylight', swatch: '#4f46e5' },
  { id: 'paper', label: 'Paper', swatch: '#b45309' }
];

var App = {
  route: 'today',
  views: {},
  actions: {},
  hooks: [],
  _chartData: {},

  /* ------------------------------------------------------------- lifecycle */
  init: function () {
    var res = load();
    this.applyTheme();
    document.body.classList.toggle('privacy', !!DB.settings.privacy);
    try { this.route = localStorage.getItem(ROUTE_KEY) || 'today'; } catch (e) { }
    if (!this.views[this.route]) this.route = 'today';

    this.bindGlobal();
    this.render();

    if (res.corrupt) this.toast('That budget file looked damaged — started a fresh one. Old copy kept in your browser.', 'warn', 9000);
    if (!DB.done.welcome) {
      var self = this;
      setTimeout(function () { self.onboard(); }, 380);
    } else if (!DB.done.tour && DB.tx.length) {
      var s2 = this;
      setTimeout(function () { s2.startTour(); }, 700);
    }
  },

  applyTheme: function () {
    var t = DB.settings.theme || 'midnight';
    document.documentElement.setAttribute('data-theme', t);
    var meta = document.querySelector('meta[name=color-scheme]');
    if (meta) meta.setAttribute('content', (t === 'daylight' || t === 'paper') ? 'light dark' : 'dark light');
  },

  bindGlobal: function () {
    var self = this;

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-act]');
      if (t && self.actions[t.dataset.act]) {
        if (t.tagName === 'BUTTON' && t.type !== 'submit') e.preventDefault();
        self.actions[t.dataset.act](t, e);
        return;
      }
      var close = e.target.closest('[data-close]');
      if (close) { self.closeModal(); return; }
      if (e.target.id === 'modal-root' || e.target.classList.contains('scrim')) self.closeModal();
    });

    document.addEventListener('change', function (e) {
      var el = e.target;
      if (el.dataset && el.dataset.field) {
        self.commitField(el);
      }
    });
    document.addEventListener('input', function (e) {
      var el = e.target;
      if (el.dataset && el.dataset.live) {
        var out = document.getElementById(el.dataset.live);
        if (out) out.textContent = el.dataset.liveFmt === 'money' ? money(Number(el.value)) : el.value;
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { self.closeModal(); self.endTour(); }
      if (e.key === 'n' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); self.actions.addTx(); }
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        var q = document.getElementById('qaInput'); if (q) q.focus();
      }
      if (e.key === 'z' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); undo(); }
    });

    var qa = document.getElementById('quickAdd');
    qa.addEventListener('submit', function (e) {
      e.preventDefault();
      var inp = document.getElementById('qaInput');
      self.quickAdd(inp.value);
      inp.value = '';
    });
  },

  /* --------------------------------------------------- field binding layer */
  commitField: function (el) {
    var f = el.dataset.field, id = el.dataset.id || el.dataset.idx;
    var v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'number' || el.dataset.num !== undefined) v = Number(v) || 0;
    var target = null;
    switch (f) {
      case 'setting': target = DB.settings; break;
      case 'cat': target = byId(DB.cats, id); break;
      case 'account': target = byId(DB.accounts, id); break;
      case 'bill': target = byId(DB.bills, id); break;
      case 'income': target = byId(DB.income, id); break;
      case 'debt': target = byId(DB.debts, id); break;
      case 'goal': target = byId(DB.goals, id); break;
      case 'tx': target = byId(DB.tx, id); break;
      default: target = DB.settings;
    }
    if (!target) return;
    var key = el.dataset.key;
    if (key) target[key] = v;
    else target[f] = v;
    if (el.dataset.after && this.actions[el.dataset.after]) { this.actions[el.dataset.after](el); return; }
    save();
    this.render();
  },

  /* --------------------------------------------------------------- routing */
  go: function (route) {
    if (!this.views[route]) return;
    this.route = route;
    try { localStorage.setItem(ROUTE_KEY, route); } catch (e) { }
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
    this.closeModal();
    this.render();
  },

  focusKey: function (el) {
    if (!el || !el.dataset) return null;
    return [el.dataset.field, el.dataset.key, el.dataset.id || el.dataset.idx, el.tagName, el.type].join('|');
  },

  render: function () {
    var active = document.activeElement;
    var key = this.focusKey(active);
    var scroll = window.scrollY, selStart = null;
    if (active && active.setSelectionRange) { try { selStart = active.selectionStart; } catch (e) { } }

    this.renderNav();
    this.renderSidebar();

    var view = this.views[this.route] || this.views.today;
    document.getElementById('pageTitle').textContent = typeof view.title === 'function' ? view.title() : view.title;
    document.getElementById('pageCrumb').textContent = typeof view.crumb === 'function' ? view.crumb() : (view.crumb || '');
    this._chartData = {};
    document.getElementById('view').innerHTML = view.html();
    this.hooks = [];
    if (view.after) view.after();

    if (key) {
      var found = null;
      var all = document.querySelectorAll('[data-field]');
      for (var i = 0; i < all.length; i++) { if (this.focusKey(all[i]) === key) { found = all[i]; break; } }
      if (found) {
        found.focus();
        if (selStart !== null && found.setSelectionRange) { try { found.setSelectionRange(selStart, selStart); } catch (e) { } }
      } else { window.scrollTo(0, scroll); }
    }
  },

  renderNav: function () {
    var items = ['today', 'spend', 'bills', 'debts', 'goals', 'calendar', 'reports', 'settings'];
    var labels = { today: 'Today', spend: 'Spend', bills: 'Bills', debts: 'Debts', goals: 'Goals', calendar: 'Calendar', reports: 'Reports', settings: 'Settings' };
    var self = this;
    var dueCount = billOccurrences(today(), nextPayday(today())).filter(function (o) { return !o.paid; }).length;
    var env = envelopes().filter(function (e) { return e.over; }).length;
    var badgeFor = { bills: dueCount, spend: env };
    var html = items.map(function (k) {
      var b = badgeFor[k];
      return '<button class="nav-item' + (self.route === k ? ' on' : '') + '" data-act="go" data-view="' + k + '">' +
        svgIcon(k) + '<span>' + labels[k] + '</span>' +
        (b ? '<span class="badge' + (k === 'spend' ? '' : ' soft') + '">' + b + '</span>' : '') + '</button>';
    }).join('');
    document.getElementById('nav').innerHTML = html;

    var tabs = ['today', 'spend', 'bills', 'debts', 'goals'];
    document.getElementById('tabbar').innerHTML = tabs.map(function (k) {
      return '<button class="' + (self.route === k ? 'on' : '') + '" data-act="go" data-view="' + k + '">' +
        svgIcon(k, 19) + '<span>' + labels[k] + '</span></button>';
    }).join('');

    document.getElementById('brandName').textContent = BRAND.name;
  },

  renderSidebar: function () {
    var sts = safeToSpend();
    var days = diffDays(today(), sts.payday);
    var due = sts.billsList.length;
    document.getElementById('sidePayday').innerHTML =
      '<div class="lbl">Next payday</div>' +
      '<div class="big num">' + fmtDate(sts.payday, 'short') + '</div>' +
      '<div class="sub">' + (days === 0 ? 'Today — money in!' : days === 1 ? 'Tomorrow' : 'in ' + days + ' days') + '</div>' +
      '<div class="count">' + svgIcon('bills', 13) + due + ' bill' + (due === 1 ? '' : 's') + ' · ' + money0(sts.bills) + '</div>';
  },

  /* ---------------------------------------------------------------- views
     Component helpers used by every view                                     */
  M: function (v, cls) { return '<span class="amt' + (cls ? ' ' + cls : '') + '">' + money(v) + '</span>'; },
  cat: function (id) {
    return byId(DB.cats, id) || { id: id, name: id === 'income' ? 'Income' : 'Other', icon: '\uD83D\uDCE6', color: 'var(--muted)' };
  },
  catChip: function (id) {
    var c = this.cat(id);
    return '<span class="chip ghost" style="color:' + c.color + '">' + c.icon + ' ' + esc(c.name) + '</span>';
  },
  empty: function (em, title, sub, action) {
    return '<div class="empty"><div class="em">' + em + '</div><b>' + esc(title) + '</b>' +
      '<span class="small">' + esc(sub) + '</span>' + (action || '') + '</div>';
  },
  head: function (t, s, right, id) {
    return '<div class="card-head"' + (id ? ' data-tour="' + id + '"' : '') + '><div><div class="t">' + t + '</div>' +
      (s ? '<div class="s">' + s + '</div>' : '') + '</div><div class="right">' + (right || '') + '</div></div>';
  },
  chip: function (text, kind) { return '<span class="chip ' + (kind || '') + '">' + text + '</span>'; },

  /* ----------------------------------------------------------- quick add */
  quickAdd: function (text) {
    var d = parseQuickAdd(text);
    if (!d.amount) { this.toast('Add an amount — e.g. "12.50 coffee"', 'warn'); return; }
    if (!d.catId) d.catId = d.type === 'income' ? 'income' : 'other';
    if (!d.accountId) d.accountId = (DB.accounts[0] || {}).id || 'chk';
    var tx = {
      id: uid('tx'), date: d.date, amount: d.type === 'income' ? d.amount : -d.amount,
      catId: d.catId, accountId: d.accountId, note: d.note || this.cat(d.catId).name,
      tags: ['quick'], type: d.type, cleared: true
    };
    snapshot('quick add');
    DB.tx.push(tx);
    var acct = byId(DB.accounts, d.accountId);
    if (acct && acct.kind !== 'credit') acct.balance = r2((Number(acct.balance) || 0) + tx.amount);
    save();
    this.render();
    var self = this;
    this.toast((tx.amount < 0 ? 'Logged ' : 'Added ') + money(Math.abs(tx.amount)) + ' \u2192 ' + this.cat(tx.catId).name, 'ok', 6000,
      function () { undo(); });
  },

  /* --------------------------------------------------------------- toasts */
  toast: function (msg, kind, ms, undoFn) {
    var root = document.getElementById('toast-root');
    var el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.innerHTML = '<span>' + msg + '</span>';
    if (undoFn) {
      var b = document.createElement('button');
      b.className = 'undo'; b.textContent = 'Undo';
      b.onclick = function () { undoFn(); el.remove(); };
      el.appendChild(b);
    }
    root.appendChild(el);
    setTimeout(function () {
      el.classList.add('out');
      setTimeout(function () { el.remove(); }, 260);
    }, ms || 3200);
  },

  /* --------------------------------------------------------------- modals */
  modal: function (o) {
    var root = document.getElementById('modal-root');
    root.innerHTML =
      '<div class="scrim"></div>' +
      '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
      '<button class="modal-x" data-close aria-label="Close">' + svgIcon('x') + '</button>' +
      (o.title ? '<h3>' + o.title + '</h3>' : '') +
      (o.sub ? '<div class="sub">' + o.sub + '</div>' : '') +
      '<div class="modal-body">' + (o.body || '') + '</div>' +
      (o.foot ? '<div class="modal-foot">' + o.foot + '</div>' : '') +
      '</div>';
    root.classList.add('open');
    if (o.after) o.after(root);
    var f = root.querySelector('input,select,textarea,button.primary');
    if (f && !o.noFocus) setTimeout(function () { try { f.focus(); if (f.select) f.select(); } catch (e) { } }, 60);
    return root;
  },
  closeModal: function () {
    var root = document.getElementById('modal-root');
    root.classList.remove('open');
    root.innerHTML = '';
  },
  confirm: function (o) {
    var self = this;
    this.modal({
      title: o.title || 'Are you sure?',
      body: '<p class="small muted">' + (o.body || '') + '</p>',
      foot: '<button class="btn" data-close>Cancel</button>' +
        '<button class="btn ' + (o.danger ? 'danger' : 'primary') + '" id="cfmOk">' + (o.ok || 'Confirm') + '</button>',
      after: function (root) {
        root.querySelector('#cfmOk').onclick = function () { self.closeModal(); o.onOk && o.onOk(); };
      }
    });
  },

  /* ------------------------------------------------------------- finances */
  addTx: function () {
    var self = this;
    var d = ymd(today());
    var cats = DB.cats.map(function (c) { return '<option value="' + c.id + '">' + c.icon + ' ' + esc(c.name) + '</option>'; }).join('');
    var accts = DB.accounts.map(function (a) { return '<option value="' + a.id + '">' + esc(a.name) + '</option>'; }).join('');
    this.modal({
      title: 'Log a transaction',
      sub: 'Expenses are negative, income is positive. Categories drive your envelopes.',
      body:
        '<div class="grid g-2" style="gap:12px">' +
        '<label class="field"><span class="lb">Amount</span><input type="number" step="0.01" id="txAmount" placeholder="0.00" inputmode="decimal"></label>' +
        '<label class="field"><span class="lb">Type</span><select id="txType"><option value="expense">Expense (money out)</option><option value="income">Income (money in)</option></select></label>' +
        '<label class="field"><span class="lb">Date</span><input type="date" id="txDate" value="' + d + '"></label>' +
        '<label class="field"><span class="lb">Account</span><select id="txAcct">' + accts + '</select></label>' +
        '<label class="field" style="grid-column:1/-1"><span class="lb">Note / merchant</span><input type="text" id="txNote" placeholder="Trader Joe\'s"></label>' +
        '<label class="field" style="grid-column:1/-1"><span class="lb">Category</span><select id="txCat">' + cats + '</select></label>' +
        '</div>' +
        '<label class="check" style="margin-top:14px"><input type="checkbox" id="txAdjust" checked> Also adjust the account balance</label>',
      foot: '<button class="btn" data-close>Cancel</button><button class="btn primary" id="txSave">Save transaction</button>',
      after: function (root) {
        root.querySelector('#txSave').onclick = function () {
          var amt = Math.abs(Number(root.querySelector('#txAmount').value) || 0);
          if (!amt) { self.toast('Enter an amount first', 'warn'); return; }
          var type = root.querySelector('#txType').value;
          var tx = {
            id: uid('tx'), date: root.querySelector('#txDate').value || d,
            amount: type === 'income' ? amt : -amt,
            catId: type === 'income' ? 'income' : root.querySelector('#txCat').value,
            accountId: root.querySelector('#txAcct').value,
            note: root.querySelector('#txNote').value || (type === 'income' ? 'Income' : self.cat(root.querySelector('#txCat').value).name),
            tags: [], type: type, cleared: true
          };
          snapshot('new transaction');
          DB.tx.push(tx);
          if (root.querySelector('#txAdjust').checked) {
            var a = byId(DB.accounts, tx.accountId);
            if (a) a.balance = r2((Number(a.balance) || 0) + tx.amount);
          }
          save(); self.closeModal(); self.render();
          self.toast('Transaction saved', 'ok', 5000, function () { undo(); });
        };
      }
    });
  },

  editTx: function (id) {
    var tx = byId(DB.tx, id);
    if (!tx) return;
    var self = this;
    var cats = DB.cats.map(function (c) {
      return '<option value="' + c.id + '"' + (c.id === tx.catId ? ' selected' : '') + '>' + c.icon + ' ' + esc(c.name) + '</option>';
    }).join('');
    var accts = DB.accounts.map(function (a) {
      return '<option value="' + a.id + '"' + (a.id === tx.accountId ? ' selected' : '') + '>' + esc(a.name) + '</option>';
    }).join('');
    this.modal({
      title: 'Edit transaction',
      body:
        '<div class="grid g-2" style="gap:12px">' +
        '<label class="field"><span class="lb">Amount (use \u2212 for expense)</span><input type="number" step="0.01" id="exAmt" value="' + tx.amount + '"></label>' +
        '<label class="field"><span class="lb">Date</span><input type="date" id="exDate" value="' + String(tx.date).slice(0, 10) + '"></label>' +
        '<label class="field" style="grid-column:1/-1"><span class="lb">Note</span><input type="text" id="exNote" value="' + esc(tx.note) + '"></label>' +
        '<label class="field"><span class="lb">Category</span><select id="exCat">' + cats + '</select></label>' +
        '<label class="field"><span class="lb">Account</span><select id="exAcct">' + accts + '</select></label>' +
        '</div>',
      foot: '<button class="btn danger" id="exDel">Delete</button><span style="flex:1"></span>' +
        '<button class="btn" data-close>Cancel</button><button class="btn primary" id="exSave">Save changes</button>',
      after: function (root) {
        root.querySelector('#exSave').onclick = function () {
          snapshot('edit');
          tx.amount = Number(root.querySelector('#exAmt').value) || 0;
          tx.date = root.querySelector('#exDate').value;
          tx.note = root.querySelector('#exNote').value;
          tx.catId = root.querySelector('#exCat').value;
          tx.accountId = root.querySelector('#exAcct').value;
          tx.type = tx.amount >= 0 ? 'income' : 'expense';
          save(); self.closeModal(); self.render();
          self.toast('Updated', 'ok', 5000, function () { undo(); });
        };
        root.querySelector('#exDel').onclick = function () {
          snapshot('delete');
          DB.tx = DB.tx.filter(function (x) { return x.id !== id; });
          save(); self.closeModal(); self.render();
          self.toast('Deleted', 'ok', 5000, function () { undo(); });
        };
      }
    });
  },

  /* ---------------------------------------------------------- bill helpers */
  paidState: function (billId, date) {
    var v = DB.paid[occurrenceKey(billId, date)];
    if (!v) return null;
    return v === 'skip' ? 'skip' : 'paid';
  },

  payBill: function (billId, dateStr) {
    var bill = byId(DB.bills, billId);
    if (!bill) return;
    var self = this;
    var dt = dateStr || ymd(today());
    var accts = DB.accounts.map(function (a) { return '<option value="' + a.id + '"' + (a.id === bill.accountId ? ' selected' : '') + '>' + esc(a.name) + '</option>'; }).join('');
    this.modal({
      title: 'Mark paid — ' + esc(bill.name),
      sub: 'Recorded against ' + fmtDate(dt, 'medium') + '. Due ' + money(bill.amount) + '.',
      body:
        '<div class="grid g-2" style="gap:12px">' +
        '<label class="field"><span class="lb">Amount paid</span><input type="number" step="0.01" id="pbAmt" value="' + bill.amount + '"></label>' +
        '<label class="field"><span class="lb">Date paid</span><input type="date" id="pbDate" value="' + dt + '"></label>' +
        '<label class="field" style="grid-column:1/-1"><span class="lb">Paid from</span><select id="pbAcct">' + accts + '</select></label>' +
        '</div>' +
        '<label class="check" style="margin-top:14px"><input type="checkbox" id="pbLog" checked> Add it to my spending log</label>',
      foot: '<button class="btn" data-close>Cancel</button>' +
        '<button class="btn" id="pbSkip">Skip this month</button>' +
        '<button class="btn primary" id="pbOk">Mark paid</button>',
      after: function (root) {
        root.querySelector('#pbOk').onclick = function () {
          var amt = Number(root.querySelector('#pbAmt').value) || bill.amount;
          var when = root.querySelector('#pbDate').value || dt;
          snapshot('bill payment');
          var d0 = parseYMD(when);
          DB.paid[occurrenceKey(bill.id, parseYMD(dt))] = when;
          if (root.querySelector('#pbLog').checked) {
            var acctId = root.querySelector('#pbAcct').value;
            DB.tx.push({
              id: uid('tx'), date: when, amount: -Math.abs(amt), catId: bill.catId,
              accountId: acctId, note: bill.name, tags: ['bill'], type: 'expense', cleared: true
            });
            var a = byId(DB.accounts, acctId);
            if (a && a.kind !== 'credit') a.balance = r2((Number(a.balance) || 0) - Math.abs(amt));
          }
          if (bill.freq === 'bimonthly') { /* no auto-advance for multi-month cycles */ }
          save(); self.closeModal(); self.render();
          self.toast(esc(bill.name) + ' marked paid', 'ok', 5000, function () { undo(); });
        };
        root.querySelector('#pbSkip').onclick = function () {
          snapshot('skip');
          DB.paid[occurrenceKey(bill.id, parseYMD(dt))] = 'skip';
          save(); self.closeModal(); self.render();
          self.toast('Skipped this cycle', 'ok', 4000, function () { undo(); });
        };
      }
    });
  },

  billForm: function (id) {
    var b = id ? byId(DB.bills, id) : null;
    var self = this;
    var newId = uid('bill');
    var cats = DB.cats.map(function (c) {
      return '<option value="' + c.id + '"' + (b && b.catId === c.id ? ' selected' : '') + '>' + c.icon + ' ' + esc(c.name) + '</option>';
    }).join('');
    var accts = DB.accounts.map(function (a) {

  startTour: function () {
    var self = this;
    var steps = [
      { view: 'today', sel: '#safeCard', title: 'Start here: safe to spend', body: 'The one number that matters. It already subtracts every bill, debt minimum and goal deposit due before your next payday — then keeps a buffer.' },
      { view: 'today', sel: '[data-tour="math"]', title: 'Never guess again', body: 'Tap “Show the math” any time to see exactly how the number was built. No black boxes.' },
      { view: 'today', sel: '[data-tour="forecast"]', title: '45-day cash forecast', body: 'Your real balance projected forward with every bill and payday marked — so you can see a tight week before it arrives.' },
      { view: 'spend', sel: '[data-tour="envelopes"]', title: 'Envelopes that pace you', body: 'Caps per category with a daily allowance so the money lasts the whole month, not three weeks.' },
      { view: 'bills', sel: '[data-tour="billlist"]', title: 'Every bill, on time', body: 'One tap marks a bill paid and logs the expense. Skip a cycle when a bill doesn’t hit.' },
      { view: 'debts', sel: '[data-tour="debtplan"]', title: 'Debt payoff simulator', body: 'Snowball, avalanche or your own order. See the exact payoff date and the interest you avoid.' },
      { view: 'goals', sel: '[data-tour="goals"]', title: 'Goals that finish', body: 'Set a target and a monthly amount; the app tells you the finish line and whether you are on track.' },
      { view: 'reports', sel: '[data-tour="reports"]', title: 'Reports for the big picture', body: 'Trends, net worth, top merchants and a savings-rate streak — plus CSV export.' }
    ];
    var i = 0;
    var root = document.getElementById('tour-root');
    root.classList.add('on');

    function paint() {
      var s = steps[i];
      if (self.route !== s.view) self.go(s.view);
      setTimeout(function () {
        var el = document.querySelector(s.sel);
        var rect = el ? el.getBoundingClientRect() : { left: 0, top: 0, width: 0, height: 0 };
        var pad = 8;
        root.innerHTML =
          '<div class="tour-scrim"></div>' +
          '<div class="tour-spot" style="left:' + (rect.left - pad) + 'px;top:' + (rect.top - pad) + 'px;width:' + (rect.width + pad * 2) + 'px;height:' + (rect.height + pad * 2) + 'px"></div>' +
          '<div class="tour-pop" style="left:' + Math.min(Math.max(14, rect.left), window.innerWidth - 360) + 'px;top:' + Math.min(rect.bottom + 14, window.innerHeight - 230) + 'px">' +

          '<div class="row" style="margin-top:14px;gap:8px">' +
          '<button class="btn sm ghost" data-act="tourEnd">Skip tour</button><span style="flex:1"></span>' +
          (i > 0 ? '<button class="btn sm" data-act="tourPrev">Back</button>' : '') +
          '<button class="btn sm primary" data-act="tourNext">' + (i === steps.length - 1 ? 'Finish' : 'Next') + '</button>' +
          '</div></div>';
      }, 120);
    }
    this.actions.tourNext = function () {
      if (i === steps.length - 1) { self.endTour(); return; }
      i++; paint();
    };
    this.actions.tourPrev = function () { if (i > 0) { i--; paint(); } };
    this.actions.tourEnd = function () { self.endTour(); };
    paint();
  },

  download: function (filename, text, mime) {
    try {
      var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1200);
      return true;
    } catch (e) {
      this.toast('Download blocked by the browser — try opening the file from a folder instead of a preview pane.', 'err', 7000);
      return false;
    }
  },
